<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>Lockes Neffe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: Spielfeld randlos im Querformat, darueber Pergamentkarten wie Einlagen in einem Druck von 1690.
   Touch: Steuerkreuz unten links, Aktionsknopf E unten rechts, Dialoge dazwischen. */
:root {
  --ink: #2b2118;
  --ink-soft: #5a4632;
  --parchment: #f3e6c4;
  --parchment-deep: #e4d0a0;
  --seal: #9c2f2a;
  --gold: #c99a3a;
  --night: #16211a;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "IM Fell English", "Palatino Linotype", Georgia, serif;
  --steuer: 168px;
  --rand: 18px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; }
#spiel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

.karte {
  background: var(--parchment);
  border: 2px solid var(--ink);
  box-shadow: 0 0 0 3px var(--parchment-deep), 0 0 0 5px var(--ink), 0 6px 18px rgba(0, 0, 0, .45);
  border-radius: 2px;
}
#hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 14px);
  padding: 8px 12px 10px;
  display: grid; gap: 4px;
  max-width: min(300px, calc(100vw - 110px));
}
#hud .eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
#ziel { font-family: var(--display); font-size: 20px; line-height: 1.1; text-wrap: balance; }
#siegel { display: flex; gap: 6px; margin-top: 2px; }
#siegel span {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
}
#siegel span.fertig { background: var(--seal); border-color: var(--seal); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18); }
#siegel span.aktuell { border-color: var(--seal); border-width: 2px; }

#kartenBtn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  font-family: var(--display); font-size: 16px; color: var(--ink);
  padding: 6px 12px; min-height: 44px; cursor: pointer;
}
#kartenBtn[aria-pressed="true"] { background: var(--parchment-deep); }

#hinweis {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding: 6px 14px; font-style: italic; font-size: 16px; white-space: nowrap;
  transition: opacity .6s;
}
#hinweis.weg { opacity: 0; pointer-events: none; }

#dialog {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: min(560px, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 16px 20px 14px;
  display: grid; gap: 8px;
}
/* Auf Touchgeraeten liegt der Dialog zwischen Steuerkreuz und Aktionsknopf und verdeckt keins von beiden */
body.touch #dialog { width: min(560px, calc(100vw - 2 * (var(--steuer) + var(--rand) + 14px))); }
#dialog h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
#dialog h2::after { content: ""; display: block; width: 64px; height: 2px; background: var(--seal); margin-top: 6px; }
#dialog p { margin: 0; font-size: 18px; line-height: 1.4; }
#dialog .notiz { font-style: italic; font-size: 15px; color: var(--ink-soft); }
#dialog .zeile { display: flex; justify-content: flex-end; }
button {
  font: inherit; color: var(--ink); background: var(--parchment);
  border: 2px solid var(--ink); border-radius: 2px;
}
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#weiter { font-family: var(--display); font-size: 17px; padding: 5px 16px; min-height: 44px; cursor: pointer; background: var(--ink); color: var(--parchment); }
#weiter:hover { background: var(--seal); border-color: var(--seal); }

#pad {
  position: fixed;
  left: calc(env(safe-area-inset-left, 0px) + var(--rand));
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--rand));
  width: var(--steuer); height: var(--steuer);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 3px;
}
#pad button {
  background: rgba(243, 230, 196, .85); font-size: 22px; line-height: 1; padding: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#pad button.an { background: var(--parchment-deep); }
#pad [data-dir="up"] { grid-area: 1 / 2; }
#pad [data-dir="left"] { grid-area: 2 / 1; }
#pad [data-dir="right"] { grid-area: 2 / 3; }
#pad [data-dir="down"] { grid-area: 3 / 2; }

#aktion {
  position: fixed;
  right: calc(env(safe-area-inset-right, 0px) + var(--rand) + 20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--rand) + 20px);
  width: 92px; height: 92px; border-radius: 50%;
  font-family: var(--display); font-size: 38px; line-height: 1; padding: 0;
  background: rgba(243, 230, 196, .55); color: rgba(43, 33, 24, .5); border-color: rgba(43, 33, 24, .5);
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#aktion.bereit { background: var(--parchment); color: var(--seal); border: 3px solid var(--seal); box-shadow: 0 0 0 4px var(--gold); }

#drehen {
  position: fixed; inset: 0; display: none; place-items: center; padding: 16px;
  background: var(--night); color: var(--parchment); text-align: center;
}
#drehen .handy {
  width: 44px; height: 76px; margin: 0 auto 18px; border: 3px solid var(--parchment); border-radius: 8px;
  transform: rotate(-90deg);
}
#drehen p { margin: 0; font-family: var(--display); font-size: 24px; text-wrap: balance; }
@media (orientation: portrait) and (pointer: coarse) {
  #drehen { display: grid; }
}

#fehler { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
#fehler div { padding: 16px 20px; max-width: 420px; font-size: 18px; }

@media (max-height: 430px) {
  #ziel { font-size: 17px; }
  #dialog h2 { font-size: 22px; }
  #dialog p { font-size: 16px; }
  #dialog { padding: 12px 16px 10px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  #hinweis { transition: none; }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<canvas id="spiel" aria-label="Spielwelt: Jonny auf dem Weg zur Akademie der Wissenschaften"></canvas>

<div id="hud" class="karte" aria-live="polite">
  <span class="eyebrow">Nächstes Ziel</span>
  <span id="ziel">Observatorium</span>
  <div id="siegel" aria-label="Fortschritt"></div>
</div>

<button id="kartenBtn" class="karte" type="button" aria-pressed="false">Karte</button>

<div id="hinweis" class="karte">Pfeiltasten oder WASD zum Gehen, E zum Benutzen</div>

<div id="dialog" class="karte" role="dialog" aria-modal="true" aria-labelledby="dialogTitel" hidden>
  <h2 id="dialogTitel">Observatorium</h2>
  <p id="dialogText"></p>
  <p id="dialogNotiz" class="notiz"></p>
  <div class="zeile"><button id="weiter" type="button">Weiter</button></div>
</div>

<div id="pad" hidden>
  <button type="button" data-dir="up" aria-label="Nach oben">▲</button>
  <button type="button" data-dir="left" aria-label="Nach links">◀</button>
  <button type="button" data-dir="right" aria-label="Nach rechts">▶</button>
  <button type="button" data-dir="down" aria-label="Nach unten">▼</button>
</div>
<button id="aktion" type="button" aria-label="Benutzen" hidden>E</button>

<div id="drehen" role="alert"><div><div class="handy"></div><p>Bitte das Gerät quer halten</p></div></div>

<div id="fehler" hidden><div class="karte">Die Kartendaten fehlen. Öffne die Datei im Ordner <code>lockes-neffe</code>, damit die Ordner <code>welt</code> und <code>innen</code> gefunden werden.</div></div>

<script src="welt/welt_daten.js"></script>
<script src="innen/observatorium_daten.js"></script>
<script>
(function () {
  "use strict";
  var T = 16;
  var D = window.WELT;
  var INNEN = window.INNEN || {};
  var $ = function (id) { return document.getElementById(id); };
  if (!D || !INNEN.observatorium) { $("fehler").hidden = false; return; }

  var REIHE = ["observatorium", "lesesaal", "salon", "druckerei", "akademie"];
  var ORTE = {
    observatorium: { name: "Observatorium" },
    lesesaal: {
      name: "Lesesaal",
      auftrag: "Zwischen den Säulen ist es still. Hier bringst du deine Erkenntnisse in eine knappe Zusammenfassung.",
      danach: "Jetzt wartet der Historische Salon."
    },
    salon: {
      name: "Historischer Salon",
      auftrag: "Kerzenlicht und ein kalter Luftzug. Der Geist eines Philosophen prüft deine Analyse und gibt dir Rückmeldung.",
      danach: "Deine eigene Meinung gehört in die Buchdruckerei."
    },
    druckerei: {
      name: "Buchdruckerei",
      auftrag: "Es riecht nach Druckerschwärze. Hier setzt du deinen Kommentar und legst ihn der Gelehrtenwelt vor.",
      danach: "Die Akademie der Wissenschaften erwartet dich."
    },
    akademie: {
      name: "Akademie der Wissenschaften",
      auftrag: "Die Gelehrten erheben sich. Onkel John wäre stolz: Die Vernunft lebt in dir weiter. Die Aufnahmeprüfung kann beginnen.",
      danach: ""
    }
  };

  // ---------- Szenen: Oberwelt und begehbare Innenraeume
  var SZENEN = {
    welt: { d: D, src: "welt/welt.png", begehbar: { "#": 1, ".": 1, "E": 1 } },
    observatorium: { d: INNEN.observatorium, src: "innen/observatorium.png", begehbar: { "#": 1, "S": 1, "I": 1, "A": 1 } }
  };
  Object.keys(SZENEN).forEach(function (k) {
    var s = SZENEN[k];
    s.id = k; s.pw = s.d.breite * T; s.ph = s.d.hoehe * T; s.da = false;
    s.bild = new Image();
    s.bild.onload = function () { s.da = true; };
    s.bild.onerror = function () { $("fehler").hidden = false; };
    s.bild.src = s.src;
  });
  var sz = SZENEN.welt;

  // ---------- Zustand
  var st = {
    szene: "welt", x: D.start.x * T + 8, y: D.start.y * T + 12,
    dir: "up", schritt: 0, animZeit: 0, laeuft: false,
    stufe: 0, dialog: null, dialogRueck: null, aktion: null,
    rueck: null, uebersicht: false, bewegt: false
  };
  var keys = { up: false, down: false, left: false, right: false };
  var grob = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  var hochMq = window.matchMedia ? window.matchMedia("(orientation: portrait) and (pointer: coarse)") : { matches: false };
  function tastenLos() { keys.up = keys.down = keys.left = keys.right = false; }

  var tuerOrt = {};
  Object.keys(D.lernorte).forEach(function (k) {
    D.lernorte[k].tuer.forEach(function (t) { tuerOrt[t.x + "," + t.y] = k; });
  });

  function kachel(px, py) {
    var d = sz.d, tx = Math.floor(px / T), ty = Math.floor(py / T);
    if (tx < 0 || ty < 0 || tx >= d.breite || ty >= d.hoehe) return "X";
    return d.raster[ty][tx];
  }
  // Fussbox: 10 x 5 px ueber dem Fusspunkt
  function frei(px, py) {
    var pts = [[px - 5, py - 5], [px + 5, py - 5], [px - 5, py - 0.01], [px + 5, py - 0.01]];
    for (var i = 0; i < pts.length; i++) if (!sz.begehbar[kachel(pts[i][0], pts[i][1])]) return false;
    return true;
  }

  function tick(dt) {
    if (st.dialog) { st.laeuft = false; return; }
    var dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    var dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    st.laeuft = !!(dx || dy);
    if (st.laeuft) {
      if (!st.bewegt) { st.bewegt = true; $("hinweis").classList.add("weg"); }
      if (dy) st.dir = dy < 0 ? "up" : "down";
      if (dx) st.dir = dx < 0 ? "left" : "right";
      var v = 84 * dt / ((dx && dy) ? Math.SQRT2 : 1);
      var nx = st.x + dx * v, ny = st.y + dy * v;
      if (dx && frei(nx, st.y)) st.x = nx;
      if (dy && frei(st.x, ny)) st.y = ny;
      st.animZeit += dt;
      st.schritt = [1, 0, 2, 0][Math.floor(st.animZeit * 8) % 4];
    } else {
      st.schritt = 0; st.animZeit = 0;
    }
    var fuss = kachel(st.x, st.y - 2);
    if (sz.id === "welt") {
      var tx = Math.floor(st.x / T), ty = Math.floor((st.y - 2) / T);
      var ort = st.laeuft ? tuerOrt[tx + "," + ty] : null;
      if (ort === "observatorium") hineingehen(ort, ty);
      else if (ort) betreten(ort, ty);
    } else if (fuss === "A" && st.laeuft) {
      hinausgehen();
    }
    setzeAktion(sz.id === "observatorium" && kachel(st.x, st.y - 2) === "I" ? "teleskop" : null);
  }

  function setzeAktion(a) {
    if (st.aktion === a) return;
    st.aktion = a;
    $("aktion").classList.toggle("bereit", !!a);
  }

  // ---------- Szenenwechsel
  function hineingehen(id, tuerY) {
    st.rueck = { x: st.x, y: (tuerY + 2) * T + 4 };
    sz = SZENEN[id]; st.szene = id;
    var e = sz.d.eintritt;
    st.x = (e.x + 1) * T; st.y = e.y * T + 12; st.dir = e.blick || "up";
    hudAktualisieren();
  }
  function hinausgehen() {
    sz = SZENEN.welt; st.szene = "welt";
    st.x = st.rueck.x; st.y = st.rueck.y; st.dir = "down";
    setzeAktion(null);
    hudAktualisieren();
  }

  // ---------- Dialoge
  function zeigeDialog(titel, text, notiz, rueckY) {
    st.dialog = titel; st.dialogRueck = rueckY;
    tastenLos();
    $("dialogTitel").textContent = titel;
    $("dialogText").textContent = text;
    $("dialogNotiz").textContent = notiz;
    $("dialog").hidden = false;
    $("weiter").focus();
    hudAktualisieren();
  }
  function dialogSchliessen() {
    if (!st.dialog) return;
    st.dialog = null;
    if (st.dialogRueck != null) { st.y = st.dialogRueck; st.dir = "down"; }
    st.dialogRueck = null;
    $("dialog").hidden = true;
  }

  // Lernorte ohne Innenraum: kurzer Text an der Tuer
  function betreten(ort, tuerY) {
    var o = ORTE[ort], ziel = REIHE[st.stufe], text, notiz;
    if (ort === ziel) {
      text = o.auftrag;
      notiz = ort === "akademie" ? "Ende der Probefassung. Die Prüfungsräume folgen." : "Der Innenraum wird noch gebaut. " + o.danach;
      st.stufe = Math.min(st.stufe + 1, REIHE.length);
    } else if (REIHE.indexOf(ort) < st.stufe) {
      text = "Hier warst du schon. Onkel John sagte immer: Wiederholung festigt den Verstand, aber nicht zu lange.";
      notiz = "Nächstes Ziel: " + zielName() + ".";
    } else {
      text = ort === "akademie"
        ? "Der Pförtner hebt die Hand: Erst die Fakten, dann Zusammenfassung, Analyse und Kommentar. Dann darfst du zur Prüfung."
        : "Die Tür ist noch verschlossen. Ein Gelehrter geht Schritt für Schritt vor.";
      notiz = "Nächstes Ziel: " + zielName() + ".";
    }
    zeigeDialog(o.name, text, notiz, (tuerY + 2) * T + 4);
  }

  // Interaktion: nur ausloesbar, wenn Jonny auf der Flaeche vor dem Objekt steht
  function benutzen() {
    if (!st.aktion || st.dialog) return;
    if (st.aktion === "teleskop") {
      if (st.stufe === 0) {
        st.stufe = 1;
        zeigeDialog("Das große Teleskop",
          "Du blickst durch das Okular. Hier findest du bald die Texte und Übersichten, die du für deine Prüfung sammelst.",
          "Material folgt. Danach führt dein Weg zum Lesesaal.", null);
      } else {
        zeigeDialog("Das große Teleskop",
          "Der Himmel ist klar. Deine Notizen aus dem Observatorium hast du schon beisammen.",
          "Nächstes Ziel: " + zielName() + ".", null);
      }
    }
  }

  function zielName() {
    if (st.stufe >= REIHE.length) return "Aufnahme bestanden";
    if (st.stufe === 0 && st.szene === "observatorium") return "Das große Teleskop";
    return ORTE[REIHE[st.stufe]].name;
  }
  function hudAktualisieren() {
    $("ziel").textContent = zielName();
    var s = $("siegel");
    s.innerHTML = "";
    REIHE.forEach(function (k, i) {
      var sp = document.createElement("span");
      sp.title = ORTE[k].name;
      if (i < st.stufe) sp.classList.add("fertig");
      else if (i === st.stufe) sp.classList.add("aktuell");
      s.appendChild(sp);
    });
  }

  // ---------- Jonny als Pixel-Sprite (16 x 24, 1 px Rand fuer die Kontur)
  var C = {
    wig: "#f2efe8", wigS: "#c9c6cf", wigD: "#a19cab", hi: "#ffffff",
    skin: "#f0c8a6", skinS: "#d49a78", mouth: "#b0604e",
    coat: "#2e3a78", coatD: "#1f2552", coatL: "#4a5aa6", gold: "#e2b64a",
    white: "#f4f2ec", book: "#8a4b2a", bookD: "#5e3019", page: "#f1e6c8",
    breeches: "#2a2430", stock: "#eeeeee", shoe: "#1e1a1c",
    lens: "#bfe3f4", rim: "#3a3440", bow: "#1a1a22", line: "#1c1624"
  };
  function sprite(dir, s) {
    var cnv = document.createElement("canvas");
    cnv.width = 18; cnv.height = 26;
    var g = cnv.getContext && cnv.getContext("2d");
    if (!g) return null;
    var side = dir === "left" || dir === "right";
    function p(x, y, w, h, c) {
      g.fillStyle = c;
      g.fillRect((side && dir === "left" ? 15 - x - w + 1 : x) + 1, y + 1, w, h);
    }
    function bein(x, lift, c) {
      p(x, 18, 2, 4 - lift, c || C.stock);
      p(x, 22 - lift, side ? 3 : 2, 2, C.shoe);
    }
    if (dir === "down" || dir === "up") {
      bein(5, s === 1 ? 1 : 0);
      bein(9, s === 2 ? 1 : 0);
      p(4, 16, 8, 2, C.breeches);
      p(3, 10, 10, 6, C.coat);
      p(2, 14, 12, 4, C.coat);
      p(2, 14, 1, 4, C.coatD); p(13, 14, 1, 4, C.coatD);
      p(2, 17, 12, 1, C.gold);
      if (dir === "down") {
        p(6, 15, 4, 3, C.breeches);
        p(6, 10, 1, 5, C.gold); p(9, 10, 1, 5, C.gold);
        p(2, 10, 2, 5, C.coatL); p(12, 10, 2, 5, C.coatD);
        p(2, 14, 2, 1, C.gold); p(12, 14, 2, 1, C.gold);
        p(4, 11, 8, 4, C.book); p(5, 11, 6, 3, C.page); p(8, 11, 1, 4, C.bookD);
        p(5, 12, 2, 1, C.skinS); p(9, 13, 2, 1, C.skinS);
        p(3, 13, 2, 2, C.skin); p(11, 13, 2, 2, C.skin);
        p(6, 9, 4, 2, C.white);
        p(4, 0, 8, 3, C.wig); p(3, 1, 10, 2, C.wig); p(5, 0, 3, 1, C.hi);
        p(3, 3, 2, 6, C.wig); p(11, 3, 2, 6, C.wigS);
        p(3, 5, 2, 1, C.wigD); p(11, 5, 2, 1, C.wigD); p(3, 7, 2, 1, C.wigD); p(11, 7, 2, 1, C.wigD);
        p(5, 3, 6, 1, C.wigS);
        p(5, 4, 6, 5, C.skin); p(10, 4, 1, 5, C.skinS);
        p(5, 5, 2, 2, C.lens); p(9, 5, 2, 2, C.lens); p(7, 5, 2, 1, C.rim);
        p(6, 6, 1, 1, C.rim); p(9, 6, 1, 1, C.rim);
        p(8, 7, 1, 1, C.skinS); p(7, 8, 2, 1, C.mouth);
      } else {
        p(8, 12, 1, 6, C.coatD);
        p(2, 10, 2, 5, C.coatD); p(12, 10, 2, 5, C.coatD);
        p(2, 14, 2, 1, C.gold); p(12, 14, 2, 1, C.gold);
        p(4, 0, 8, 1, C.wig); p(3, 1, 10, 8, C.wig); p(5, 1, 4, 1, C.hi);
        p(3, 6, 10, 3, C.wigS);
        p(3, 5, 2, 1, C.wigD); p(11, 5, 2, 1, C.wigD); p(3, 7, 2, 1, C.wigD); p(11, 7, 2, 1, C.wigD);
        p(7, 9, 2, 3, C.wigS);
        p(6, 8, 4, 1, C.bow); p(7, 8, 2, 2, C.bow);
      }
    } else {
      var hinten = [6, 5, 7][s], vorn = [8, 9, 7][s];
      bein(hinten, 0, "#cfcfd6");
      bein(vorn, s === 2 ? 1 : 0);
      p(5, 16, 6, 2, C.breeches);
      p(4, 10, 7, 6, C.coat);
      p(3, 14, 9, 4, C.coat); p(3, 14, 2, 4, C.coatD);
      p(3, 17, 9, 1, C.gold); p(10, 10, 1, 7, C.gold);
      p(9, 9, 2, 2, C.white);
      p(9, 11, 3, 4, C.book); p(11, 11, 1, 3, C.page);
      p(6, 11, 3, 4, C.coatL); p(6, 14, 3, 1, C.gold); p(9, 13, 2, 2, C.skin);
      p(7, 3, 4, 6, C.skin); p(11, 6, 1, 1, C.skin); p(7, 3, 1, 6, C.skinS);
      p(4, 0, 7, 3, C.wig); p(5, 0, 3, 1, C.hi);
      p(4, 3, 4, 7, C.wig); p(3, 2, 2, 6, C.wig);
      p(4, 5, 3, 1, C.wigD); p(4, 7, 3, 1, C.wigD); p(3, 4, 1, 4, C.wigS);
      p(3, 8, 2, 2, C.bow); p(3, 10, 1, 2, C.wigS);
      p(9, 5, 2, 2, C.lens); p(8, 5, 1, 1, C.rim); p(10, 6, 1, 1, C.rim);
      p(10, 8, 1, 1, C.mouth);
    }
    // automatische Kontur um alle gefuellten Pixel
    var img = g.getImageData(0, 0, 18, 26), d = img.data, out = new Uint8ClampedArray(d);
    for (var y = 0; y < 26; y++) for (var x = 0; x < 18; x++) {
      var i = (y * 18 + x) * 4;
      if (d[i + 3]) continue;
      var nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (o) {
        var X = x + o[0], Y = y + o[1];
        return X >= 0 && Y >= 0 && X < 18 && Y < 26 && d[(Y * 18 + X) * 4 + 3];
      });
      if (nb) { out[i] = 28; out[i + 1] = 22; out[i + 2] = 36; out[i + 3] = 255; }
    }
    img.data.set(out);
    g.putImageData(img, 0, 0);
    return cnv;
  }
  var FRAMES = {};
  ["down", "up", "left", "right"].forEach(function (d) { FRAMES[d] = [0, 1, 2].map(function (s) { return sprite(d, s); }); });

  // ---------- Darstellung
  var cnv = $("spiel");
  var ctx = cnv.getContext && cnv.getContext("2d");
  var ruhig = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var Z = 3, dpr = 1;

  function groesse() {
    dpr = window.devicePixelRatio || 1;
    cnv.width = Math.round(window.innerWidth * dpr);
    cnv.height = Math.round(window.innerHeight * dpr);
    var zc = Math.max(2, Math.min(5, Math.round(Math.min(window.innerWidth / (26 * T), window.innerHeight / (15 * T)))));
    Z = Math.max(1, Math.round(zc * dpr));
  }
  groesse();
  window.addEventListener("resize", groesse);

  function zielPunkt() {
    if (sz.id === "observatorium") {
      var f = sz.d.interaktionen[0].flaeche;
      if (st.stufe === 0) return { x: (f.x0 + f.x1 + 1) * T / 2, y: (f.y1 + 1) * T };
      var a = sz.d.ausgang[0];
      return { x: (a.x + 2) * T, y: (a.y + 1) * T };
    }
    var ziel = REIHE[st.stufe];
    if (!ziel) return null;
    var tu = D.lernorte[ziel].tuer[0];
    return { x: tu.x * T + T, y: tu.y * T + T };
  }

  function zeichnen(t) {
    if (!ctx || !sz.da) return;
    var cw = cnv.width, ch = cnv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#16211a";
    ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = false;
    var z = st.uebersicht ? Math.min(cw / sz.pw, ch / sz.ph) : Z;
    var vw = cw / z, vh = ch / z;
    var cx = vw >= sz.pw ? (sz.pw - vw) / 2 : Math.max(0, Math.min(sz.pw - vw, st.x - vw / 2));
    var cy = vh >= sz.ph ? (sz.ph - vh) / 2 : Math.max(0, Math.min(sz.ph - vh, st.y - 10 - vh / 2));
    cx = Math.round(cx * z) / z; cy = Math.round(cy * z) / z;
    ctx.setTransform(z, 0, 0, z, -cx * z, -cy * z);
    ctx.drawImage(sz.bild, 0, 0);

    var px = Math.round(st.x), py = Math.round(st.y);
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.ellipse(px + 1, py - 1, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    var f = FRAMES[st.dir][st.laeuft ? st.schritt : 0];
    var hop = st.laeuft && st.schritt ? -1 : 0;
    if (f) ctx.drawImage(f, px - 9, py - 25 + hop);
    if (st.uebersicht) {
      ctx.strokeStyle = "#e2b64a"; ctx.lineWidth = 2 / z * dpr;
      ctx.beginPath(); ctx.arc(px, py - 12, 14 + (ruhig ? 0 : Math.sin(t / 200) * 2), 0, Math.PI * 2); ctx.stroke();
      return;
    }

    // Tastenkappe ueber Jonny, sobald eine Interaktion moeglich ist
    if (st.aktion && !st.dialog) {
      var ky = py - 36 + (ruhig ? 0 : Math.round(Math.sin(t / 220)));
      ctx.fillStyle = "#1c1624"; ctx.fillRect(px - 7, ky - 7, 14, 13);
      ctx.fillStyle = "#f3e6c4"; ctx.fillRect(px - 6, ky - 6, 12, 11);
      ctx.fillStyle = "#9c2f2a"; ctx.font = "10px Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("E", px, ky);
    }

    // Wegweiser: kleiner Goldpfeil zum naechsten Ziel
    var zp = st.dialog || st.aktion ? null : zielPunkt();
    if (zp) {
      var ddx = zp.x - st.x, ddy = zp.y - st.y, dist = Math.hypot(ddx, ddy);
      if (dist > (sz.id === "welt" ? 6 : 3) * T) {
        var a = Math.atan2(ddy, ddx), r = 20 + (ruhig ? 0 : Math.sin(t / 180) * 1.5);
        var ax = st.x + Math.cos(a) * r, ay = st.y - 12 + Math.sin(a) * r;
        ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
        ctx.fillStyle = "#1c1624";
        ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-4, -5); ctx.lineTo(-2, 0); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#e2b64a";
        ctx.beginPath(); ctx.moveTo(4.5, 0); ctx.lineTo(-2.8, -3.6); ctx.lineTo(-1.2, 0); ctx.lineTo(-2.8, 3.6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }

  var letzte = 0;
  function schleife(t) {
    var dt = Math.min(0.05, (t - letzte) / 1000 || 0);
    letzte = t;
    if (hochMq.matches) tastenLos();
    else if (!st.uebersicht) tick(dt);
    zeichnen(t);
    window.requestAnimationFrame(schleife);
  }

  // ---------- Eingabe: Tastatur
  var TASTEN = {
    ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right"
  };
  document.addEventListener("keydown", function (e) {
    if (st.dialog) {
      if (e.code === "Space" || e.code === "Enter" || e.code === "Escape") { e.preventDefault(); dialogSchliessen(); }
      return;
    }
    if (e.code === "KeyE") { e.preventDefault(); if (!e.repeat) benutzen(); return; }
    if (e.code === "KeyM") { uebersicht(!st.uebersicht); return; }
    var k = TASTEN[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  document.addEventListener("keyup", function (e) {
    var k = TASTEN[e.code];
    if (k) keys[k] = false;
  });
  window.addEventListener("blur", tastenLos);
  $("weiter").addEventListener("click", dialogSchliessen);

  function uebersicht(an) {
    st.uebersicht = an;
    tastenLos();
    $("kartenBtn").setAttribute("aria-pressed", an ? "true" : "false");
    $("kartenBtn").textContent = an ? "Zurück" : "Karte";
  }
  $("kartenBtn").addEventListener("click", function () { uebersicht(!st.uebersicht); });

  // ---------- Eingabe: Touch (Steuerkreuz links, Aktionsknopf rechts)
  if (grob) {
    document.body.classList.add("touch");
    $("pad").hidden = false;
    $("aktion").hidden = false;
    $("hinweis").textContent = "Steuerkreuz zum Gehen, E zum Benutzen";
  }
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function (b) {
    var d = b.getAttribute("data-dir");
    function an(e) { e.preventDefault(); keys[d] = true; b.classList.add("an"); }
    function aus() { keys[d] = false; b.classList.remove("an"); }
    b.addEventListener("pointerdown", an);
    b.addEventListener("pointerup", aus);
    b.addEventListener("pointercancel", aus);
    b.addEventListener("pointerleave", aus);
  });
  $("aktion").addEventListener("pointerdown", function (e) { e.preventDefault(); benutzen(); });
  $("aktion").addEventListener("click", function (e) { if (e.detail === 0) benutzen(); });

  // ---------- Start (uebernimmt bei einem Update im Viewer den Spielstand)
  function start(daten) {
    if (daten && typeof daten.x === "number") {
      st.stufe = daten.stufe || 0; st.dir = daten.dir || "up"; st.rueck = daten.rueck || null;
      if (daten.szene && SZENEN[daten.szene] && (daten.szene === "welt" || st.rueck)) { sz = SZENEN[daten.szene]; st.szene = daten.szene; }
      st.x = daten.x; st.y = daten.y;
    }
    hudAktualisieren();
    window.requestAnimationFrame(schleife);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { x: st.x, y: st.y, stufe: st.stufe, dir: st.dir, szene: st.szene, rueck: st.rueck }; });
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});

  // Test-Hook
  window.__game = {
    state: st, keys: keys, tick: tick, frei: frei, schliessen: dialogSchliessen, benutzen: benutzen,
    teleport: function (tx, ty) { st.x = tx * T + 8; st.y = ty * T + 12; }
  };
})();
</script>
