<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>Lockes Neffe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: Spielfeld randlos im Querformat, darueber Pergamentkarten wie Einlagen in einem Druck von 1690.
   Touch: Steuerkreuz unten links, Aktionsknopf E unten rechts, Dialoge dazwischen. */
:root {
  --ink: #2b2118;
  --ink-soft: #5a4632;
  --parchment: #f3e6c4;
  --parchment-deep: #e4d0a0;
  --seal: #9c2f2a;
  --gold: #c99a3a;
  --night: #16211a;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "IM Fell English", "Palatino Linotype", Georgia, serif;
  --steuer: 168px;
  --rand: 18px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; }
#spiel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

.karte {
  background: var(--parchment);
  border: 2px solid var(--ink);
  box-shadow: 0 0 0 3px var(--parchment-deep), 0 0 0 5px var(--ink), 0 6px 18px rgba(0, 0, 0, .45);
  border-radius: 2px;
}
#hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: calc(env(safe-area-inset-left, 0px) + 14px);
  padding: 8px 12px 10px;
  display: grid; gap: 4px;
  max-width: min(300px, calc(100vw - 110px));
}
#hud .eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
#ziel { font-family: var(--display); font-size: 20px; line-height: 1.1; text-wrap: balance; }
#siegel { display: flex; gap: 6px; margin-top: 2px; }
#siegel span {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-soft); background: transparent;
}
#siegel span.fertig { background: var(--seal); border-color: var(--seal); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .18); }
#siegel span.aktuell { border-color: var(--seal); border-width: 2px; }

#kartenBtn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  font-family: var(--display); font-size: 16px; color: var(--ink);
  padding: 6px 12px; min-height: 44px; cursor: pointer;
}
#kartenBtn[aria-pressed="true"] { background: var(--parchment-deep); }

#hinweis {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding: 6px 14px; font-style: italic; font-size: 16px; white-space: nowrap;
  transition: opacity .6s;
}
#hinweis.weg { opacity: 0; pointer-events: none; }

#dialog {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: min(560px, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 16px 20px 14px;
  display: grid; gap: 8px;
}
/* Auf Touchgeraeten liegt der Dialog zwischen Steuerkreuz und Aktionsknopf und verdeckt keins von beiden */
body.touch #dialog { width: min(560px, calc(100vw - 2 * (var(--steuer) + var(--rand) + 14px))); }
#dialog h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; text-wrap: balance; }
#dialog h2::after { content: ""; display: block; width: 64px; height: 2px; background: var(--seal); margin-top: 6px; }
#dialog p { margin: 0; font-size: 18px; line-height: 1.4; }
#dialog .notiz { font-style: italic; font-size: 15px; color: var(--ink-soft); }
#dialog .zeile { display: flex; justify-content: flex-end; }
button {
  font: inherit; color: var(--ink); background: var(--parchment);
  border: 2px solid var(--ink); border-radius: 2px;
}
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#weiter { font-family: var(--display); font-size: 17px; padding: 5px 16px; min-height: 44px; cursor: pointer; background: var(--ink); color: var(--parchment); }
#weiter:hover { background: var(--seal); border-color: var(--seal); }

#pad {
  position: fixed;
  left: calc(env(safe-area-inset-left, 0px) + var(--rand));
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--rand));
  width: var(--steuer); height: var(--steuer);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 3px;
}
#pad button {
  background: rgba(243, 230, 196, .85); font-size: 22px; line-height: 1; padding: 0;
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#pad button.an { background: var(--parchment-deep); }
#pad [data-dir="up"] { grid-area: 1 / 2; }
#pad [data-dir="left"] { grid-area: 2 / 1; }
#pad [data-dir="right"] { grid-area: 2 / 3; }
#pad [data-dir="down"] { grid-area: 3 / 2; }

#aktion {
  position: fixed;
  right: calc(env(safe-area-inset-right, 0px) + var(--rand) + 20px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--rand) + 20px);
  width: 92px; height: 92px; border-radius: 50%;
  font-family: var(--display); font-size: 38px; line-height: 1; padding: 0;
  background: rgba(243, 230, 196, .55); color: rgba(43, 33, 24, .5); border-color: rgba(43, 33, 24, .5);
  -webkit-user-select: none; user-select: none; touch-action: none;
}
#aktion.bereit { background: var(--parchment); color: var(--seal); border: 3px solid var(--seal); box-shadow: 0 0 0 4px var(--gold); }

#drehen {
  position: fixed; inset: 0; display: none; place-items: center; padding: 16px;
  background: var(--night); color: var(--parchment); text-align: center;
}
#drehen .handy {
  width: 44px; height: 76px; margin: 0 auto 18px; border: 3px solid var(--parchment); border-radius: 8px;
  transform: rotate(-90deg);
}
#drehen p { margin: 0; font-family: var(--display); font-size: 24px; text-wrap: balance; }
@media (orientation: portrait) and (pointer: coarse) {
  #drehen { display: grid; }
}

#material {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  width: min(760px, calc(100vw - 32px));
  box-sizing: border-box; padding: 12px 16px;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
}
body.touch #material { width: min(760px, calc(100vw - 2 * (var(--steuer) + var(--rand) + 14px))); }
#material h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.1; text-wrap: balance; }
#materialInhalt {
  overflow: auto; min-height: 0; background: #fbf5e6; border: 1px solid var(--ink-soft);
  touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch;
}
#materialInhalt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#materialInhalt img { display: block; width: 100%; height: auto; }
#materialInhalt .text { padding: 14px 18px 18px; font-size: 18px; line-height: 1.5; max-width: 65ch; }
#materialInhalt .text h3 { font-family: var(--display); font-weight: 400; font-size: 21px; margin: 18px 0 6px; }
#materialInhalt .text h3:first-child { margin-top: 0; }
#materialInhalt .text p { margin: 0 0 10px; }
#materialInhalt .quelle { font-style: italic; font-size: 15px; color: var(--ink-soft); }
#materialFuss { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
#materialStatus { font-style: italic; font-size: 15px; color: var(--ink-soft); flex: 1 1 200px; min-width: 0; }
#materialStatus.fertig { color: #2f6b3a; font-style: normal; }
.knoepfe { display: flex; gap: 10px; }
#zu, #laden { font-family: var(--display); font-size: 17px; padding: 5px 16px; min-height: 44px; cursor: pointer; }
#laden { background: var(--ink); color: var(--parchment); }
#laden:hover { background: var(--seal); border-color: var(--seal); }
#laden:disabled { opacity: .6; cursor: wait; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); top: 24vh;
  width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
  padding: 12px 16px; font-size: 18px; line-height: 1.35; text-align: center;
  border-color: var(--seal);
}
#toast strong { font-family: var(--display); font-weight: 400; color: var(--seal); font-size: 21px; display: block; }
#toast.leuchten { animation: aufleuchten 1.2s ease-out 2; }
@keyframes aufleuchten {
  0% { box-shadow: 0 0 0 3px var(--parchment-deep), 0 0 0 5px var(--seal), 0 0 0 0 rgba(255, 196, 90, .9); }
  100% { box-shadow: 0 0 0 3px var(--parchment-deep), 0 0 0 5px var(--seal), 0 0 0 22px rgba(255, 196, 90, 0); }
}

#fehler { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
#fehler div { padding: 16px 20px; max-width: 420px; font-size: 18px; }

@media (max-height: 430px) {
  #ziel { font-size: 17px; }
  #dialog h2 { font-size: 22px; }
  #dialog p { font-size: 16px; }
  #dialog { padding: 12px 16px 10px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  #hinweis { transition: none; }
  #toast.leuchten { animation: none; }
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<canvas id="spiel" aria-label="Spielwelt: Jonny auf dem Weg zur Akademie der Wissenschaften"></canvas>

<div id="hud" class="karte" aria-live="polite">
  <span class="eyebrow">Nächstes Ziel</span>
  <span id="ziel">Observatorium</span>
  <div id="siegel" aria-label="Fortschritt"></div>
</div>

<button id="kartenBtn" class="karte" type="button" aria-pressed="false">Karte</button>

<div id="hinweis" class="karte">Pfeiltasten oder WASD zum Gehen, E zum Benutzen</div>

<div id="dialog" class="karte" role="dialog" aria-modal="true" aria-labelledby="dialogTitel" hidden>
  <h2 id="dialogTitel">Observatorium</h2>
  <p id="dialogText"></p>
  <p id="dialogNotiz" class="notiz"></p>
  <div class="zeile"><button id="weiter" type="button">Weiter</button></div>
</div>

<div id="material" class="karte" role="dialog" aria-modal="true" aria-labelledby="materialTitel" hidden>
  <h2 id="materialTitel"></h2>
  <div id="materialInhalt" tabindex="0"></div>
  <div id="materialFuss">
    <span id="materialStatus"></span>
    <div class="knoepfe"><button id="zu" type="button">Schließen</button><button id="laden" type="button">Herunterladen</button></div>
  </div>
</div>

<div id="toast" class="karte" role="status" hidden></div>

<div id="pad" hidden>
  <button type="button" data-dir="up" aria-label="Nach oben">▲</button>
  <button type="button" data-dir="left" aria-label="Nach links">◀</button>
  <button type="button" data-dir="right" aria-label="Nach rechts">▶</button>
  <button type="button" data-dir="down" aria-label="Nach unten">▼</button>
</div>
<button id="aktion" type="button" aria-label="Benutzen" hidden>E</button>

<div id="drehen" role="alert"><div><div class="handy"></div><p>Bitte das Gerät quer halten</p></div></div>

<div id="fehler" hidden><div class="karte">Die Kartendaten fehlen. Öffne die Datei im Ordner <code>lockes-neffe</code>, damit die Ordner <code>welt</code> und <code>innen</code> gefunden werden.</div></div>

<script src="welt/welt_daten.js"></script>
<script src="innen/observatorium_daten.js"></script>
<script>
(function () {
  "use strict";
  var T = 16;
  var D = window.WELT;
  var INNEN = window.INNEN || {};
  var $ = function (id) { return document.getElementById(id); };
  if (!D || !INNEN.observatorium) { $("fehler").hidden = false; return; }

  var REIHE = ["observatorium", "lesesaal", "salon", "druckerei", "akademie"];
  var ORTE = {
    observatorium: { name: "Observatorium" },
    lesesaal: {
      name: "Lesesaal",
      auftrag: "Zwischen den Säulen ist es still. Hier bringst du deine Erkenntnisse in eine knappe Zusammenfassung.",
      danach: "Jetzt wartet der Historische Salon."
    },
    salon: {
      name: "Historischer Salon",
      auftrag: "Kerzenlicht und ein kalter Luftzug. Der Geist eines Philosophen prüft deine Analyse und gibt dir Rückmeldung.",
      danach: "Deine eigene Meinung gehört in die Buchdruckerei."
    },
    druckerei: {
      name: "Buchdruckerei",
      auftrag: "Es riecht nach Druckerschwärze. Hier setzt du deinen Kommentar und legst ihn der Gelehrtenwelt vor.",
      danach: "Die Akademie der Wissenschaften erwartet dich."
    },
    akademie: {
      name: "Akademie der Wissenschaften",
      auftrag: "Die Gelehrten erheben sich. Onkel John wäre stolz: Die Vernunft lebt in dir weiter. Die Aufnahmeprüfung kann beginnen.",
      danach: ""
    }
  };

  // ---------- Material im Observatorium. Jede Stelle muss angesehen UND heruntergeladen werden.
  // Die drei Infografiken schalten das Teleskop frei, dort liegt Lockes Text.
  var MATERIAL = {
    regal_links: {
      titel: "Platons Theätet", art: "bild",
      datei: "material/infografik_theaetet.jpg", name: "Infografik_Platon_Theaetet.jpg",
      alt: "Infografik: Platons Theätet und die Suche nach dem Wesen des Wissens"
    },
    regal_rechts: {
      titel: "Vom bloßen Meinen zum gesicherten Wissen", art: "bild",
      datei: "material/infografik_meinen_und_wissen.jpg", name: "Infografik_Meinen_und_Wissen_Gettier.jpg",
      alt: "Infografik: Platons Theätet und das Gettier-Problem"
    },
    kartentisch: {
      titel: "Rationalismus vs. Empirismus", art: "bild",
      datei: "material/infografik_rationalismus_empirismus.jpg", name: "Infografik_Rationalismus_Empirismus.jpg",
      alt: "Infografik: Grundlagen der Erkenntnistheorie, Descartes und Locke"
    },
    teleskop: {
      titel: "John Locke: Der Ursprung der Ideen", art: "text",
      datei: "material/arbeitsblatt_locke_erkenntnistheorie.pdf", name: "Arbeitsblatt_Locke_Erkenntnistheorie.pdf"
    }
  };
  var INFOGRAFIKEN = ["regal_links", "regal_rechts", "kartentisch"];
  var ALLE_MATERIALIEN = INFOGRAFIKEN.concat(["teleskop"]);
  var LOCKE_TEXT =
    '<div class="text">' +
    '<p class="quelle">John Locke (1632–1704): An Essay Concerning Human Understanding, 1690. Das vollständige Arbeitsblatt mit den Arbeitsaufträgen lädst du unten herunter.</p>' +
    '<h3>Text 1: Der Ursprung der Ideen (Buch II, Kapitel 1)</h3>' +
    '<p>Nehmen wir also an, der Geist sei, wie man sagt, ein unbeschriebenes Blatt (tabula rasa), ohne alle Schriftzeichen, frei von allen Ideen. Wie werden ihm diese zugeführt? Wie gelangt er zu dem gewaltigen Vorrat an Ideen, den die geschäftige Phantasie des Menschen mit einer fast unbegrenzten Abwechslung auf ihn hinmalt? Woher hat er all das Material für seine Vernunft und seine Erkenntnis? Ich antworte darauf mit einem einzigen Worte: aus der Erfahrung. Auf sie gründet sich unsere gesamte Erkenntnis, von ihr leitet sie sich letztlich her.</p>' +
    '<p>Unsere Beobachtung, die entweder auf äußere sinnlich wahrnehmbare Objekte gerichtet ist oder auf innere Operationen des Geistes, liefert unserem Verstand das gesamte Material des Denkens. Dies sind die beiden Quellen der Erkenntnis.</p>' +
    '<p>Erstens: SENSATION. Unsere Sinne, die auf äußere Objekte gerichtet sind, führen dem Geist verschiedene Ideen von Dingen zu, wie Gelb, Weiß, Warm, Kalt, Weich, Hart, Bitter und Süß. Diese Quelle nennen wir Sensation. Zweitens: REFLEXION. Die andere Quelle ist die Wahrnehmung der Operationen unseres eigenen Geistes im Innern, wie Denken, Zweifeln, Glauben, Schließen, Wollen. Diese Quelle nennen wir Reflexion.</p>' +
    '<h3>Text 2: Der Umfang und die Grenzen unseres Wissens (Buch IV, Kapitel 3)</h3>' +
    '<p>Da der Geist keine anderen unmittelbaren Objekte seiner Betrachtung hat als seine eigenen Ideen, so ist es klar, dass unsere Erkenntnis nur auf diese bezogen ist. Erkenntnis ist nichts anderes als die Wahrnehmung des Zusammenhangs und der Übereinstimmung oder des Widerstreits zwischen unseren Ideen.</p>' +
    '<p>Daraus folgt unmittelbar: Erstens: Unser Wissen reicht nicht weiter als unsere Ideen. Zweitens: Unser Wissen ist noch enger als unsere Ideen, weil wir nicht immer die Übereinstimmung oder Nichtübereinstimmung zwischen ihnen wahrnehmen können. Wir besitzen keine intuitive oder demonstrative Gewissheit über die unendliche Natur der Dinge. Unser sensitives Wissen erstreckt sich nicht einmal so weit wie unsere Vorstellungen selbst. Wir tappen in vielen Bereichen der Wirklichkeit völlig im Dunkeln.</p>' +
    '</div>';

  // ---------- Szenen: Oberwelt und begehbare Innenraeume
  var SZENEN = {
    welt: { d: D, src: "welt/welt.png", begehbar: { "#": 1, ".": 1, "E": 1 } },
    observatorium: { d: INNEN.observatorium, src: "innen/observatorium.png", begehbar: { "#": 1, "S": 1, "I": 1, "A": 1 } }
  };
  Object.keys(SZENEN).forEach(function (k) {
    var s = SZENEN[k];
    s.id = k; s.pw = s.d.breite * T; s.ph = s.d.hoehe * T; s.da = false;
    s.bild = new Image();
    s.bild.onload = function () { s.da = true; };
    s.bild.onerror = function () { $("fehler").hidden = false; };
    s.bild.src = s.src;
  });
  var sz = SZENEN.welt;

  // ---------- Zustand
  var st = {
    szene: "welt", x: D.start.x * T + 8, y: D.start.y * T + 12,
    dir: "up", schritt: 0, animZeit: 0, laeuft: false,
    stufe: 0, dialog: null, dialogRueck: null, aktion: null,
    rueck: null, uebersicht: false, bewegt: false,
    material: null, gesehen: {}, geladen: {}
  };
  function fertig(id) { return !!(st.gesehen[id] && st.geladen[id]); }
  function infografikenFertig() { return INFOGRAFIKEN.every(fertig); }
  function allesFertig() { return ALLE_MATERIALIEN.every(fertig); }
  function anzahlFertig(liste) { return liste.filter(fertig).length; }
  var keys = { up: false, down: false, left: false, right: false };
  var grob = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  var hochMq = window.matchMedia ? window.matchMedia("(orientation: portrait) and (pointer: coarse)") : { matches: false };
  function tastenLos() { keys.up = keys.down = keys.left = keys.right = false; }

  var tuerOrt = {};
  Object.keys(D.lernorte).forEach(function (k) {
    D.lernorte[k].tuer.forEach(function (t) { tuerOrt[t.x + "," + t.y] = k; });
  });

  function kachel(px, py) {
    var d = sz.d, tx = Math.floor(px / T), ty = Math.floor(py / T);
    if (tx < 0 || ty < 0 || tx >= d.breite || ty >= d.hoehe) return "X";
    return d.raster[ty][tx];
  }
  // Fussbox: 10 x 5 px ueber dem Fusspunkt
  function frei(px, py) {
    var pts = [[px - 5, py - 5], [px + 5, py - 5], [px - 5, py - 0.01], [px + 5, py - 0.01]];
    for (var i = 0; i < pts.length; i++) if (!sz.begehbar[kachel(pts[i][0], pts[i][1])]) return false;
    return true;
  }

  function tick(dt) {
    if (st.dialog) { st.laeuft = false; return; }
    var dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    var dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    st.laeuft = !!(dx || dy);
    if (st.laeuft) {
      if (!st.bewegt) { st.bewegt = true; $("hinweis").classList.add("weg"); }
      if (dy) st.dir = dy < 0 ? "up" : "down";
      if (dx) st.dir = dx < 0 ? "left" : "right";
      var v = 84 * dt / ((dx && dy) ? Math.SQRT2 : 1);
      var nx = st.x + dx * v, ny = st.y + dy * v;
      if (dx && frei(nx, st.y)) st.x = nx;
      if (dy && frei(st.x, ny)) st.y = ny;
      st.animZeit += dt;
      st.schritt = [1, 0, 2, 0][Math.floor(st.animZeit * 8) % 4];
    } else {
      st.schritt = 0; st.animZeit = 0;
    }
    var fuss = kachel(st.x, st.y - 2);
    if (sz.id === "welt") {
      var tx = Math.floor(st.x / T), ty = Math.floor((st.y - 2) / T);
      var ort = st.laeuft ? tuerOrt[tx + "," + ty] : null;
      if (ort === "observatorium") hineingehen(ort, ty);
      else if (ort) betreten(ort, ty);
    } else if (fuss === "A" && st.laeuft) {
      if (sz.id === "observatorium" && !allesFertig()) {
        st.y = 22 * T - 3; st.dir = "up"; tastenLos();
        zeigeToast("Halt!", "Du hast noch nicht alle Materialien angesehen und heruntergeladen. Gesichert: " +
          anzahlFertig(ALLE_MATERIALIEN) + " von " + ALLE_MATERIALIEN.length + ".");
      } else {
        hinausgehen();
      }
    }
    setzeAktion(interaktionAn(st.x, st.y - 2));
  }

  // Welche Interaktion gehoert zur Kachel unter Jonnys Fuessen?
  function interaktionAn(px, py) {
    var liste = sz.d.interaktionen;
    if (!liste || kachel(px, py) !== "I") return null;
    var tx = Math.floor(px / T), ty = Math.floor(py / T);
    for (var i = 0; i < liste.length; i++) {
      var f = liste[i].flaeche;
      if (tx >= f.x0 && tx <= f.x1 && ty >= f.y0 && ty <= f.y1) return liste[i].id;
    }
    return null;
  }

  function setzeAktion(a) {
    if (st.aktion === a) return;
    st.aktion = a;

    b.addEventListener("pointerleave", aus);
  });
  $("aktion").addEventListener("pointerdown", function (e) { e.preventDefault(); benutzen(); });
  $("aktion").addEventListener("click", function (e) { if (e.detail === 0) benutzen(); });

  // ---------- Start (uebernimmt bei einem Update im Viewer den Spielstand)
  function start(daten) {
    if (daten && typeof daten.x === "number") {
      st.stufe = daten.stufe || 0; st.dir = daten.dir || "up"; st.rueck = daten.rueck || null;
      if (daten.szene && SZENEN[daten.szene] && (daten.szene === "welt" || st.rueck)) { sz = SZENEN[daten.szene]; st.szene = daten.szene; }
      st.x = daten.x; st.y = daten.y; st.gesehen = daten.gesehen || {}; st.geladen = daten.geladen || {};
    }
    hudAktualisieren();
    window.requestAnimationFrame(schleife);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { x: st.x, y: st.y, stufe: st.stufe, dir: st.dir, szene: st.szene, rueck: st.rueck, gesehen: st.gesehen, geladen: st.geladen }; });
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});

  // Test-Hook
  window.__game = {
    state: st, keys: keys, tick: tick, frei: frei, schliessen: dialogSchliessen, benutzen: benutzen,
    herunterladen: herunterladen, materialSchliessen: materialSchliessen,
    teleport: function (tx, ty) { st.x = tx * T + 8; st.y = ty * T + 12; }
  };
})();
</script>
