<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seven Periods</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>
/* ===== 1. DESIGN TOKENS (Classic American High School Theme) ===== */
:root {
  --c-burgundy: #800020;
  --c-navy: #1E2D4A;
  --c-cream: #F5E6C4;
  --c-cream-light: #FAF3E0;
  --c-yellow: #EAA816;
  --c-green: #2E6F40;
  --c-green-bg: #E3F2E8;
  --c-red: #B22222;
  --c-red-bg: #F8E3E3;
  --c-wood: #8B4513;
  --c-wood-dark: #5C2E0B;

  --c-bg: var(--c-navy);
  --c-surface: var(--c-cream-light);
  --c-ink: #1F1F1F;
  --c-muted: #555555;
  --c-line: #D1C2A5;
  --c-accent: var(--c-burgundy);

  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-hand: 'Permanent Marker', cursive;

  --fs-body: 18px;
  --fs-h1: 38px;
  --fs-h2: 26px;
  --fs-h3: 20px;

  --r-s: 8px;
  --r-m: 14px;
  --r-l: 24px;
  --gap: 16px;
  --tap: 48px;
}

/* ===== 2. BASE & LAYOUT ===== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--c-bg); color: var(--c-ink); font: var(--fs-body)/1.5 var(--font-body); }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}

#app {
  width: 100%;
  max-width: 1150px;
  height: 100vh;
  height: 100dvh;
  max-height: 720px;
  background: var(--c-cream);
  border: 6px solid var(--c-burgundy);
  border-radius: var(--r-l);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; color: var(--c-navy); text-transform: uppercase; letter-spacing: 0.5px; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
p { margin: 0 0 .8em; }

button {
  font-family: var(--font-display);
  font-size: 16px;
  min-height: var(--tap);
  padding: .5em 1.2em;
  border-radius: var(--r-m);
  border: 2px solid var(--c-navy);
  background: var(--c-surface);
  color: var(--c-navy);
  cursor: pointer;
  box-shadow: 0 3px 0 var(--c-navy);
  transition: all 0.1s ease;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--c-navy); }
button.primary { background: var(--c-burgundy); color: #FFF; border-color: #4A0013; box-shadow: 0 3px 0 #4A0013; }
button.primary:active { box-shadow: 0 1px 0 #4A0013; }
button:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
:focus-visible { outline: 3px solid var(--c-yellow); outline-offset: 2px; }

input[type=text], textarea {
  font-family: var(--font-body);
  font-size: 17px;
  padding: .5em .7em;
  border: 2px solid var(--c-navy);
  border-radius: var(--r-s);
  background: #FFF;
  color: var(--c-ink);
}

.wrap { padding: var(--gap); overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
.muted { color: var(--c-muted); }
.row { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }

/* Avatars */
.asset { border-radius: 50%; flex-shrink: 0; }
.avatar-badge {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: var(--c-navy);
  color: var(--c-yellow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 32px;
  border: 4px solid var(--c-yellow);
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  flex-shrink: 0;
}

/* ===== TOPBAR (HALL PASS & TARDY SLIP) ===== */
.topbar {
  background: var(--c-navy);
  border-bottom: 4px solid var(--c-burgundy);
  color: #FFF;
  padding: 8px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px var(--gap);
  align-items: center;
  z-index: 5;
}

.hallpass {
  background: #FFF8DC;
  color: #333;
  border: 2px dashed var(--c-burgundy);
  border-radius: var(--r-s);
  padding: 4px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  font-family: var(--font-display);
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.stamp {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px dashed #AAA;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: bold;
}
.stamp.on { background: var(--c-burgundy); color: #FFF; border: 2px solid var(--c-burgundy); }
.stamp.gold.on { background: var(--c-yellow); color: var(--c-navy); border-color: var(--c-navy); }

.tardy-badge {
  background: var(--c-red-bg);
  color: var(--c-red);
  border: 2px solid var(--c-red);
  padding: 2px 8px;
  border-radius: var(--r-s);
  font-family: var(--font-display);
  font-size: 14px;
}

/* ===== SCENE & DIALOGUES ===== */
.scene { display: flex; gap: 20px; align-items: flex-end; margin: 16px 0; }
.bubble {
  background: #FFF;
  border: 3px solid var(--c-navy);
  border-radius: var(--r-m);
  padding: 16px 20px;
  position: relative;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
  flex: 1;
}
.bubble::before {
  content: '';
  position: absolute;
  bottom: 15px;
  left: -14px;
  border-width: 8px 14px 8px 0;
  border-style: solid;
  border-color: transparent var(--c-navy) transparent transparent;
}
.bubble .who { font-family: var(--font-display); color: var(--c-burgundy); font-size: 18px; display: block; }

/* ===== GLOSSARY (MATT'S SURVIVAL GUIDE) ===== */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
.gcard {
  background: #FFF;
  border: 2px solid var(--c-navy);
  border-radius: var(--r-m);
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--c-line);
}
.gcard .term { font-family: var(--font-display); font-size: 18px; color: var(--c-burgundy); }
.gcard .de { display: none; margin-top: 6px; color: var(--c-green); font-weight: bold; font-size: 15px; }
.gcard.open .de { display: block; }

/* ===== HALLWAY & DOORS ===== */
.hallway-container {
  background: linear-gradient(to bottom, #2C3E50 0%, #1A252F 60%, var(--c-wood-dark) 60%, var(--c-wood) 100%);
  border-radius: var(--r-m);
  padding: 24px 16px;
  border: 3px solid var(--c-navy);
  margin-top: 10px;
}
.hallway { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; }
.door {
  flex: 0 0 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  background: var(--c-wood);
  border: 4px solid var(--c-wood-dark);
  border-radius: var(--r-m) var(--r-m) 0 0;
  padding: 12px 8px;
  min-height: 280px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
}
.door .sign { background: var(--c-yellow); color: var(--c-navy); font-family: var(--font-display); padding: 4px 8px; border-radius: 4px; font-size: 14px; width: 100%; }
.door .period { font-size: 13px; color: #FFF; font-weight: bold; }
.door.locked { background: #555; border-color: #333; opacity: 0.7; }
.door.done { border-color: var(--c-green); background: #3B5E43; }
.door.bonus { border-color: var(--c-yellow); background: #8B7500; }

/* ===== TASK CARDS ===== */
.task {
  background: #FFF;
  border: 3px solid var(--c-navy);
  border-radius: var(--r-m);
  padding: 18px 20px;
  margin: 14px 0;
  box-shadow: 0 4px 0 rgba(0,0,0,0.08);
}
.item { padding: 12px 0; border-top: 2px dashed var(--c-line); }
.item:first-of-type { border-top: 0; }
.item.ok { background: var(--c-green-bg); padding: 10px; border-radius: var(--r-s); border-top: 0; }
.item.bad { background: var(--c-red-bg); padding: 10px; border-radius: var(--r-s); border-top: 0; }
.fb { font-weight: bold; margin-top: 6px; }
.fb.ok { color: var(--c-green); }
.fb.bad { color: var(--c-red); }

.choices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* Chunk selector */
.chunk { display: inline-block; padding: 2px 6px; margin: 2px; border: 2px solid transparent; border-radius: var(--r-s); cursor: pointer; }
.chunk:hover { border-color: var(--c-navy); }
.chunk.sel { border-color: var(--c-red); background: var(--c-red-bg); font-weight: bold; }

/* Rule Card Overlay */
.rule { border: 3px solid var(--c-burgundy); border-radius: var(--r-m); padding: 16px; background: #FFF8DC; margin-bottom: 12px; }
.rule ul { margin: .4em 0 0; padding-left: 1.2em; }

/* Writing Hub */
.write-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--gap); }
.write-grid textarea { width: 100%; min-height: 260px; line-height: 1.5; font-size: 16px; }
.check li { list-style: none; margin: 4px 0; }
.check li::before { content: "☐ "; color: var(--c-muted); font-size: 18px; }
.check li.hit::before { content: "☑ "; color: var(--c-green); font-size: 18px; }

/* Notebook & Modals */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
.panel { background: var(--c-cream-light); border: 4px solid var(--c-navy); border-radius: var(--r-l); max-width: 850px; width: 100%; max-height: 85vh; overflow: auto; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

/* ===== SKIN: Paper, ink and lockers (Design concept "Seven Periods") ===== */
:root {
  --c-paper: #FBF4DF;
  --c-slip: #F6D96B;
  --c-locker: #2B3F63;
  --c-locker-dark: #18243A;
  --c-wall: #D9C9A3;
  --c-floor: #A0623A;
}
/* Hall pass: folded paper with ink stamps */
.hallpass {
  background: linear-gradient(90deg, var(--c-paper) 0 49.6%, #EADFC2 49.6% 50.4%, var(--c-paper) 50.4%);
  border: 2px solid var(--c-burgundy);
  border-radius: 4px;
  padding: 4px 10px 4px 8px;
  transform: rotate(-1deg);
}
.hallpass > b { font-family: var(--font-hand); font-weight: 400; color: var(--c-burgundy); font-size: 15px; letter-spacing: .5px; margin-right: 2px; }
.stamp { width: 30px; height: 30px; border: 1.5px dashed #B9A986; color: #B9A986; font-size: 9px; font-family: var(--font-display); }
.stamp.on {
  background: transparent; color: var(--c-burgundy); border: 2.5px solid var(--c-burgundy);
  box-shadow: inset 0 0 0 2px var(--c-paper), inset 0 0 0 3px var(--c-burgundy);
  transform: rotate(-12deg); opacity: .9;
}
.stamp.on:nth-child(odd) { color: var(--c-navy); border-color: var(--c-navy); box-shadow: inset 0 0 0 2px var(--c-paper), inset 0 0 0 3px var(--c-navy); transform: rotate(8deg); }
.stamp.gold { border-color: var(--c-yellow); color: var(--c-yellow); }
.stamp.gold.on { background: var(--c-yellow); color: var(--c-navy); border-color: var(--c-navy); box-shadow: none; transform: rotate(-6deg); }
/* Tardy slip: yellow paper with a red count */
.tardy-badge {
  background: var(--c-slip); color: var(--c-ink); border: 0; border-radius: 2px;
  padding: 4px 10px; transform: rotate(2deg);
  box-shadow: 0 2px 4px rgba(0,0,0,.35);
  display: inline-flex; align-items: baseline; gap: 6px;
}
.tardy-badge .lbl { font-family: var(--font-display); font-size: 12px; letter-spacing: 1px; }
.tardy-badge .n { font-family: var(--font-hand); color: var(--c-red); font-size: 20px; line-height: 1; }
/* Hallway: wall with lockers, wooden floor, doors in the wall */
.hallway-container {
  background:
    linear-gradient(to bottom, transparent 0 calc(100% - 46px), var(--c-floor) calc(100% - 46px)),
    linear-gradient(to bottom, var(--c-wall) 0 22px, var(--c-burgundy) 22px 30px, var(--c-wall) 30px);
  padding: 44px 16px 20px;
}
.hallway {
  gap: 74px; padding: 0 30px 14px;
  background:
    repeating-linear-gradient(90deg, var(--c-locker) 0 31px, var(--c-locker-dark) 31px 34px) 0 30px / 100% calc(100% - 44px) no-repeat;
}
.door { position: relative; background: linear-gradient(var(--c-wood), #7A3B10); box-shadow: inset 0 0 0 6px rgba(0,0,0,.12), 0 6px 10px rgba(0,0,0,.35); }
.door::after { content: ''; position: absolute; right: 12px; top: 56%; width: 12px; height: 12px; border-radius: 50%; background: var(--c-yellow); box-shadow: inset -2px -2px 0 rgba(0,0,0,.3); }
.door { color: #FFF; }
.door .sign { font-size: 13px; }
.door.locked { background: linear-gradient(#6B6B6B, #4E4E4E); opacity: .8; }
.door.done { background: linear-gradient(#3F6E4B, #2E5638); }
.door.bonus { background: linear-gradient(#9C8414, #7A670C); }
/* Notebook: lined paper with margin and spiral */
.panel.notebook {
  background:
    radial-gradient(circle at 14px 50%, var(--c-navy) 5px, transparent 6px) 0 0 / 28px 32px repeat-y,
    linear-gradient(90deg, transparent 52px, #D9534F 52px 54px, transparent 54px),
    repeating-linear-gradient(var(--c-paper) 0 31px, #BFD3E6 31px 32px);
  padding-left: 70px; border-color: var(--c-navy);
}
.panel.notebook h2 { font-family: var(--font-hand); text-transform: none; font-weight: 400; color: var(--c-navy); }
.notebook .gcard { background: transparent; border: 0; border-bottom: 1px dashed var(--c-line); border-radius: 0; box-shadow: none; }
.gcard .term { font-family: var(--font-hand); font-size: 20px; }
/* Rule card: Zach's clipboard */
.rule { position: relative; background: var(--c-paper); border: 3px solid var(--c-wood); border-top-width: 16px; border-radius: 6px; }
.rule::before { content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 64px; height: 12px; background: #9AA3AE; border-radius: 3px; }
.rule > b { font-family: var(--font-hand); font-weight: 400; font-size: 20px; color: var(--c-burgundy); }

/* ===== PHOTO HALLWAY: painted canvas wall + realistic doors ===== */
.hallway-container { padding: 0; background: #2B2620; overflow: hidden; border-width: 4px; }
.hallway {
  align-items: flex-end; gap: 84px; padding: 46px 48px 38px; min-height: 380px;
  background: none; background-repeat: no-repeat; background-attachment: local;
}
.door {
  flex: 0 0 136px; height: 272px; min-height: 0; padding: 10px 10px 34px;
  border: 7px solid #8E949B; border-bottom: 0; border-radius: 3px 3px 0 0;
  background:
    linear-gradient(to top, #C3C8CE 0 24px, #8E949B 24px 26px, transparent 26px),
    repeating-linear-gradient(90deg, rgba(60,30,10,.10) 0 1px, transparent 1px 5px, rgba(255,220,180,.05) 5px 6px, transparent 6px 11px),
    linear-gradient(90deg, #7A4A22, #A36C38 35%, #94602F 65%, #6E421E);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 0 0 2px #5E646B, 8px 0 18px rgba(0,0,0,.45);
  justify-content: flex-start; gap: 8px;
}
.door::after { right: 9px; top: 58%; width: 22px; height: 7px; border-radius: 4px; background: linear-gradient(#EEF0F2, #9097A0); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.door .period { text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.door .sign { background: linear-gradient(#F1BC3A, #D99A12); box-shadow: 0 2px 3px rgba(0,0,0,.35); border-radius: 2px; }
.door .ico {
  width: 58px; height: 92px; margin: 4px 0 0; display: flex; align-items: center; justify-content: center;
  font-size: 26px; border: 4px solid #6E747B; border-radius: 2px;
  background: linear-gradient(135deg, rgba(255,255,255,.55) 0 18%, transparent 18% 40%, rgba(255,255,255,.25) 40% 46%, transparent 46%), linear-gradient(#CFE3EE, #8FB3C7);
  box-shadow: inset 0 0 8px rgba(0,0,0,.35);
}
.door .state { margin-top: auto; font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: #FFF; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.door.locked { filter: grayscale(.85) brightness(.7); opacity: 1; background:
    linear-gradient(to top, #C3C8CE 0 24px, #8E949B 24px 26px, transparent 26px),
    repeating-linear-gradient(90deg, rgba(60,30,10,.10) 0 1px, transparent 1px 5px),
    linear-gradient(90deg, #7A4A22, #A36C38 35%, #6E421E); }
.door.done { background:
    linear-gradient(to top, #C3C8CE 0 24px, #8E949B 24px 26px, transparent 26px),
    repeating-linear-gradient(90deg, rgba(60,30,10,.10) 0 1px, transparent 1px 5px),
    linear-gradient(90deg, #7A4A22, #A36C38 35%, #6E421E); border-color: #8E949B; }
.door.done .ico { background: linear-gradient(135deg, rgba(255,255,255,.45) 0 18%, transparent 18%), linear-gradient(#CDEBD5, #7FB58E); color: var(--c-green); font-weight: bold; }
.door.done .state { background: var(--c-green); padding: 1px 6px; border-radius: 2px; }
.door.bonus { border-color: #6E747B; background:
    linear-gradient(to top, #A9AEB4 0 24px, transparent 24px),
    linear-gradient(90deg, #B98F12, #E2B523 40%, #A57E0C); }
.door:not(:disabled):hover { outline: 3px solid var(--c-yellow); outline-offset: -3px; }
@media (max-width: 640px) {
  .hallway { gap: 56px; padding: 36px 28px 30px; min-height: 330px; }
  .door { flex-basis: 118px; height: 236px; }
  .door .ico { height: 70px; }
}

/* ===== HALLWAY LIFE: posters, notes and stickers between the doors ===== */
.hallway { gap: 6px; }
.deco { flex: 0 0 78px; align-self: stretch; position: relative; pointer-events: none; }
.poster, .note, .sticker { position: absolute; box-shadow: 0 3px 6px rgba(0,0,0,.45); text-align: center; line-height: 1.1; }
.poster { left: 4px; right: 4px; padding: 8px 4px; font-family: var(--font-display); font-size: 10px; text-transform: uppercase; }
.poster b { display: block; font-size: 13px; margin: 2px 0; }
.poster::before, .note::before { content: ''; position: absolute; top: -6px; left: 50%; width: 30px; height: 11px; transform: translateX(-50%) rotate(-3deg); background: rgba(255,250,230,.55); box-shadow: 0 1px 1px rgba(0,0,0,.1); }
.note { left: 8px; right: 6px; padding: 10px 4px 8px; font-family: var(--font-hand); font-size: 11px; color: #2A2A2A; background: #FFE873; }
.sticker { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 11px; }
.p-home { background: var(--c-burgundy); color: var(--c-yellow); transform: rotate(-3deg); }
.p-fit { background: #FF6FA8; color: #fff; transform: rotate(2deg); }
.p-film { background: #111; color: #fff; transform: rotate(-1.5deg); border: 3px solid #fff; }
.p-buzz { background: var(--c-yellow); color: var(--c-navy); transform: rotate(3deg); }
.p-beat { background: var(--c-navy); color: #fff; transform: rotate(-2deg); border-bottom: 5px solid var(--c-yellow); }
.p-rule { background: #fff; color: var(--c-red); border: 3px solid var(--c-red); transform: rotate(1deg); font-size: 9px; }
@media (max-width: 640px) { .deco { flex-basis: 64px; } .poster { font-size: 9px; } .poster b { font-size: 11px; } }

/* ===== 3D CORRIDOR: walls left and right, vanishing point, flag signs ===== */
.asset.portrait { width: auto; border-radius: 10px; border: 3px solid var(--c-navy); background: #F6E9CD; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.corridor {
  --D: 2600px;
  position: relative; height: min(460px, 62vh); min-height: 320px; margin-top: 10px;
  perspective: 520px; perspective-origin: 50% 40%; overflow: hidden;
  border: 4px solid var(--c-navy); border-radius: var(--r-m); background: #1A1712;
}
.stage { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; }
.corridor .door { pointer-events: auto; }
.corridor .gone { display: none !important; }
.plane { position: absolute; transform-style: preserve-3d; transition: background-position 1.2s ease-in-out; }
.wall { top: 0; height: 100%; width: var(--D); background-color: #2B3F63; background-repeat: no-repeat, repeat-x; background-size: 100% 100%, auto 100%; }
.wall.left { left: 0; transform-origin: 0 50%; transform: rotateY(90deg);
  background-image: linear-gradient(90deg, rgba(0,0,0,0) 10%, rgba(18,14,10,.82) 100%), var(--tex, none); }
.wall.right { right: 0; transform-origin: 100% 50%; transform: rotateY(-90deg);
  background-image: linear-gradient(90deg, rgba(18,14,10,.82) 0%, rgba(0,0,0,0) 90%), var(--tex, none); }
.floor { left: 0; width: 100%; height: var(--D); top: calc(100% - var(--D)); transform-origin: 50% 100%; transform: rotateX(90deg);
  background:
    linear-gradient(to bottom, rgba(18,14,10,.9), rgba(18,14,10,0) 75%),
    linear-gradient(90deg, rgba(0,0,0,.25), rgba(255,250,235,.22) 50%, rgba(0,0,0,.25)),
    conic-gradient(#DCD2BD 25%, #BFB39A 0 50%, #DCD2BD 0 75%, #BFB39A 0) 0 0 / 110px 110px;
}
.ceiling { left: 0; width: 100%; height: var(--D); top: 0; transform-origin: 50% 0; transform: rotateX(-90deg);
  background:
    linear-gradient(to top, rgba(18,14,10,.9), rgba(18,14,10,0) 70%),
    linear-gradient(90deg, #CFCBBF 0 36%, transparent 36% 64%, #CFCBBF 64%),
    repeating-linear-gradient(to bottom, #CFCBBF 0 170px, #FFFBEA 170px 240px);
}
.endwall { inset: 0; transform: translateZ(calc(var(--D) * -1));
  background: linear-gradient(#3A332B, #221D17); display: flex; align-items: flex-end; justify-content: center; }
.endwall .exitdoors { width: 34%; height: 62%; background: linear-gradient(90deg, #8E949B 0 4%, #C9D9E2 4% 48%, #8E949B 48% 52%, #C9D9E2 52% 96%, #8E949B 96%); box-shadow: 0 0 120px 40px rgba(255,248,220,.35); position: relative; }
.endwall .exitdoors::before { content: 'EXIT'; position: absolute; top: -70px; left: 50%; transform: translateX(-50%); background: #111; color: #FF3B30; font: 700 40px/1 var(--font-display); padding: 6px 14px; letter-spacing: 3px; text-shadow: 0 0 12px #FF3B30; }
.corridor .door {
  position: absolute; bottom: 0; width: 170px; height: 64%; flex: none; padding: 14px 10px 34px;
  transition: left 1.2s ease-in-out, opacity .6s; transform-style: preserve-3d; justify-content: flex-start;
}
.corridor .door.passed, .corridor .deco.passed { opacity: 0; visibility: hidden; pointer-events: none; transition: left 1.2s ease-in-out, opacity .5s, visibility 0s linear .5s; }
.corridor .door .ico { width: 64px; height: 42%; }
.corridor .door .plate { background: #C9CED6; color: #333; font: 700 11px/1 var(--font-display); padding: 3px 6px; border-radius: 2px; }
.corridor .door.locked { filter: none; background:
    linear-gradient(to top, #9DA1A6 0 24px, #6E7378 24px 26px, transparent 26px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 5px),
    linear-gradient(90deg, #4E4840, #6A625A 35%, #423C35); }
.corridor .door.locked .ico { background: linear-gradient(#9AA6AD, #6F7B82); }
.door.locked .flag { background: linear-gradient(#E4E2DC, #C8C5BD); color: #555; }
.corridor .door.current { box-shadow: inset 0 0 0 2px rgba(0,0,0,.28), 0 0 0 2px #5E646B, 0 0 40px 10px rgba(234,168,22,.55); }
.flag {
  position: absolute; top: -8px; width: 168px; padding: 7px 8px; border: 3px solid #5E646B;
  background: linear-gradient(#FFFFFF, #E9E4D8); color: var(--c-navy); border-radius: 3px; text-align: center;
  font: 800 15px/1.1 var(--font-display); text-transform: uppercase; box-shadow: 0 6px 10px rgba(0,0,0,.35);
}
.flag small { display: block; font: 700 11px/1 var(--font-body); color: var(--c-burgundy); letter-spacing: 1px; margin-bottom: 3px; }
.wall.left .flag { left: -6px; transform-origin: 0 50%; transform: rotateY(-90deg) translateZ(1px); }
.wall.right .flag { right: -6px; transform-origin: 100% 50%; transform: rotateY(90deg) translateZ(1px); }
.door.current .flag { background: linear-gradient(#FFE9A8, var(--c-yellow)); }
.door.done .flag small { color: var(--c-green); }
.corridor .deco { position: absolute; bottom: 0; height: 64%; width: 84px; transition: left 1.2s ease-in-out, opacity .6s; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips button { min-height: 40px; padding: .3em .8em; font-size: 14px; }
.chips button.done { border-color: var(--c-green); color: var(--c-green); box-shadow: 0 3px 0 var(--c-green); }
@media (max-width: 640px) {
  .corridor { perspective: 380px; }
  .corridor .door { width: 130px; }
  .flag { width: 130px; font-size: 12px; }
}

/* ===== STUDY HALL: cards and embedded exercise ===== */
.sh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 8px; }
.sh-card { text-align: left; padding: 16px; min-height: 130px; display: flex; flex-direction: column; gap: 6px; background: var(--c-paper); }
.sh-card .tag { align-self: flex-start; font: 700 11px/1 var(--font-body); letter-spacing: 1px; text-transform: uppercase; background: var(--c-navy); color: #fff; padding: 4px 8px; border-radius: 3px; }
.sh-card .t { font: 800 19px/1.15 var(--font-display); color: var(--c-burgundy); }
.sh-card > span:not(.tag):not(.t) { font: 400 15px/1.35 var(--font-body); color: var(--c-ink); }
.sh-card > .src { margin-top: auto; font-size: 12px; color: var(--c-muted); }
.sh-empty { background: var(--c-paper); border: 2px dashed var(--c-line); border-radius: var(--r-m); padding: 20px; color: var(--c-muted); }
.sh-view { position: fixed; inset: 0; z-index: 30; background: var(--c-navy); display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
.sh-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 12px; color: #fff; }
.sh-bar b { font-family: var(--font-display); font-size: 18px; flex: 1; min-width: 0; }
.sh-bar a { color: var(--c-yellow); font-size: 14px; }
.sh-view iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.sh-note { color: #C9D3E6; font-size: 12px; padding: 0 12px 6px; }

/* Small screens */
@media (max-width: 640px) {
  :root { --fs-body: 16px; --fs-h2: 21px; --gap: 12px; }
  #app { border-width: 3px; border-radius: 0; max-height: none; }
  .write-grid { grid-template-columns: 1fr; }
  .scene { gap: 12px; }
  .scene .asset, .scene .avatar-badge { width: 56px !important; height: 56px !important; }
  .start-title { font-size: 38px !important; }
  .door { flex-basis: 128px; min-height: 230px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* Print Mode */
#printpage { display: none; }
@media print {
  body > *:not(#printpage) { display: none !important; }
  #printpage { display: block; padding: 20mm; font-family: 'Times New Roman', serif; background: #fff; }
  #printpage h1 { font-size: 28pt; color: #000; }
}
</style>
</head>

intro: [
 {who:"Matt", asset:"matt", text:"Hi, I'm Matt. A few months ago I lived in England. Now I'm an 8th grader at Birchview Middle School in Pennsylvania. Everything is new here: the words, the rules, even lunch at 10:45 a.m."},
 {who:"Matt", asset:"matt", text:"On my first day I asked for the 'corridor'. Nobody understood me. Here it's the hallway. And a lesson is a period. I made a survival guide. Tap the words to see what they mean."},
 {glossary:true},
 {who:"Matt", asset:"matt", text:"Now the bad news. Today at 3:15 p.m. the yearbook goes to the printer. But this morning our yearbook laptop crashed, and the pages are all over the school!"},
 {who:"Matt", asset:"matt", text:"Can you help me? Here's your hall pass. Every room you finish gives you a stamp. Wrong answers give you tardy slips. Three tardy slips? Don't panic, Zach will help you."},
 {who:"Matt", asset:"matt", text:"All the school words are in my notebook. Tap it any time. Let's go!"}

/* ===== 5. ENGINE ===== */
const KEY="sevenperiods_v1";
const params=new URLSearchParams(location.search);
const hasTTS=()=>"speechSynthesis" in window;
let S=load();
function fresh(){return {mode:null,introDone:false,stamps:{},scores:{},best:{},writing:{prompt:null,text:"",title:"",name:""},gold:false};}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");const f=fresh();return Object.assign(f,d,{writing:Object.assign(f.writing,d.writing||{})});}catch(e){return fresh();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $app=document.getElementById("app");

function h(tag,props,...kids){const e=document.createElement(tag);
  for(const[k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v; else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}
  kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c instanceof Node?c:document.createTextNode(String(c)));});
  return e;}

function asset(key,w,hgt,label){
  const src = ASSETS[key];
  if(src&&src.startsWith("data:image/webp")) return h("img",{class:"asset portrait",src:src,alt:label||key,style:`height:${Math.round((hgt||80)*1.5)}px`});
  if(src) return h("img",{class:"asset",src:src,alt:label||key,style:`width:${w||80}px;height:${hgt||80}px`});
  return h("div",{class:"avatar-badge"},key.charAt(0).toUpperCase());
}

function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.!?,;:"]/g,"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const R=CONTENT.rooms;
const isTest=()=>S.mode==="test";
const unlocked=i=>params.get("all")==="1"||i===0||!!S.stamps[R[i-1].id];
const allDone=()=>R.every(r=>S.stamps[r.id]);
const maxPoints=()=>R.reduce((n,r)=>n+r.items.length,0);
const total=()=>R.reduce((n,r)=>n+(S.scores[r.id]||0),0);

/* Open answers: students often retype the given sentence start or end. Strip it before checking. */
function checkOpen(it,raw){
  let v=norm(raw);
  const ns=norm(it.start||""),ne=norm(it.end||"");
  if(ns&&v.startsWith(ns+" "))v=v.slice(ns.length+1);
  if(ne&&v.endsWith(" "+ne))v=v.slice(0,-(ne.length+1));
  if(!v)return false;
  return it.must.every(re=>re.test(v))&&!(it.forbid||[]).some(re=>re.test(v));
}

function topbar(roomCtx){
  const pass=h("div",{class:"hallpass","aria-label":"Hall pass"},h("b",{},"HALL PASS"),
    R.map(r=>h("div",{class:"stamp"+(S.stamps[r.id]?" on":""),title:r.period},r.period.split(" ")[0])),
    allDone()?h("div",{class:"stamp gold"+(S.gold?" on":""),title:"Bonus"},"★"):null);
  return h("div",{class:"topbar"},
    h("button",{onclick:showHallway},"🏫 Hallway"),pass,
    roomCtx&&!isTest()?h("span",{class:"tardy-badge"},h("span",{class:"lbl"},"TARDY SLIPS"),h("span",{class:"n",id:"tardy"},String(roomCtx.tardy))):null,
    h("div",{style:"flex:1"}),
    h("span",{style:"color:#FFF;font-size:14px;margin-right:8px"},isTest()?"Test Run":"Practice Mode"),
    h("button",{onclick:showStudyHall},"📚 Study Hall"),
    h("button",{onclick:openNotebook},"📓 Notebook"));
}
function tardyText(ctx){return String(ctx.tardy);}
function screen(...kids){if(hasTTS())speechSynthesis.cancel();$app.replaceChildren(...kids);window.scrollTo(0,0);}
function bubble(line,defAsset){return h("div",{class:"scene"},asset(line.asset||defAsset||"matt",90,90,line.who),
  h("div",{class:"bubble"},h("span",{class:"who"},line.who),line.text));}
function bubbles(lines,defAsset){return lines.map(l=>bubble(l,defAsset));}

/* ---- Start Screen ---- */
function showStart(){
  const hasSave=S.mode&&S.introDone;
  screen(h("div",{class:"wrap",style:"align-items:center;justify-content:center;text-align:center"},
    h("h1",{class:"start-title",style:"font-size:52px;color:var(--c-burgundy);margin-bottom:0"},CONTENT.title),
    h("p",{style:"font-size:20px;font-family:var(--font-display);color:var(--c-navy)"},CONTENT.subtitle),
    hasSave?h("div",{style:"margin:15px"},h("button",{id:"continueBtn",class:"primary",style:"font-size:20px",onclick:showHallway},"▶ Continue Game")):null,
    h("div",{class:"row",style:"justify-content:center;margin-top:20px"},
      h("button",{id:"practiceBtn",style:"width:240px;padding:16px",onclick:()=>startMode("practice")},h("h3",{},"Practice Mode"),h("div",{class:"muted"},"Hilfen & Regelkarten")),
      h("button",{id:"testBtn",style:"width:240px;padding:16px",onclick:()=>startMode("test")},h("h3",{},"Test Run"),h("div",{class:"muted"},"Klassenarbeits-Modus"))),
    h("div",{style:"margin-top:40px"},
      h("button",{style:"font-size:12px",onclick:()=>ask("Delete all progress?",()=>{try{localStorage.removeItem(KEY);}catch(e){}S=fresh();showStart();})},"Reset Progress"))));
}
function ask(msg,onYes){
  const ov=h("div",{class:"overlay"},h("div",{class:"panel",style:"max-width:420px;text-align:center"},
    h("p",{style:"font-size:20px"},msg),
    h("div",{class:"row",style:"justify-content:center"},
      h("button",{onclick:()=>ov.remove()},"Cancel"),
      h("button",{id:"askYes",class:"primary",onclick:()=>{ov.remove();onYes();}},"Yes"))));
  document.body.append(ov);
}
function startMode(m,sure){
  if(!sure&&S.mode&&S.mode!==m&&Object.keys(S.stamps).length)return ask("Switching mode resets progress. Continue?",()=>startMode(m,true));
  if(S.mode!==m){const keepIntro=S.introDone;S=fresh();S.introDone=keepIntro;}
  S.mode=m;save();S.introDone?showHallway():showIntro(0);
}

/* ---- Intro ---- */

    corridor,chips,

/* ---- Painted hallway wall (canvas): cinder blocks, lockers, vinyl floor with reflection ---- */
const hallCache={};
function paintHallway(){
  const cor=document.querySelector(".corridor");
  if(cor){const H=cor.clientHeight;if(!H)return;
    const k="side"+H;if(!(k in hallCache))hallCache[k]=ASSETS.hallway_bg||drawHall(42*30,H,true);
    if(hallCache[k])cor.style.setProperty("--tex",`url(${hallCache[k]})`);return;}
  const el=document.querySelector(".hallway");if(!el)return;
  if(ASSETS.hallway_bg){el.style.backgroundImage=`url(${ASSETS.hallway_bg})`;el.style.backgroundSize="cover";return;}
  const W=Math.max(el.scrollWidth,el.clientWidth),H=el.clientHeight;if(!W||!H)return;
  const k=W+"x"+H;if(!(k in hallCache))hallCache[k]=drawHall(W,H);
  if(hallCache[k]){el.style.backgroundImage=`url(${hallCache[k]})`;el.style.backgroundSize=`${W}px ${H}px`;}
}
window.addEventListener("resize",()=>requestAnimationFrame(paintHallway));
function drawHall(W,H,side){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cv=document.createElement("canvas");cv.width=W*dpr;cv.height=H*dpr;
  const c=cv.getContext&&cv.getContext("2d");if(!c)return null;
  c.scale(dpr,dpr);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const floorY=side?H:H-30, lockTop=62, lockBot=floorY-8;
  // wall: painted cinder blocks
  c.fillStyle="#D9CFBA";c.fillRect(0,0,W,floorY);
  for(let y=0,row=0;y<lockTop;y+=20,row++)for(let x=(row%2)*-24;x<W;x+=48){
    c.fillStyle=`rgba(${120+rnd()*30|0},${105+rnd()*25|0},80,${.04+rnd()*.05})`;c.fillRect(x+1,y+1,46,18);
    c.fillStyle="rgba(90,75,55,.18)";c.fillRect(x,y,48,1);c.fillRect(x,y,1,20);}
  // school stripe
  c.fillStyle="#7A0F24";c.fillRect(0,30,W,9);c.fillStyle="rgba(255,255,255,.18)";c.fillRect(0,30,W,1);c.fillStyle="#1E2D4A";c.fillRect(0,41,W,3);
  // pennant string
  c.strokeStyle="rgba(60,50,40,.6)";c.lineWidth=1;c.beginPath();c.moveTo(0,5);
  for(let x=0;x<W;x+=60)c.quadraticCurveTo(x+30,13,x+60,5);c.stroke();
  const pc=["#800020","#EAA816","#1E2D4A","#F5E6C4"];
  for(let x=4,i=0;x<W;x+=15,i++){const yy=5+Math.sin(((x%60)/60)*Math.PI)*6.5;c.fillStyle=pc[i%4];c.beginPath();c.moveTo(x,yy);c.lineTo(x+12,yy);c.lineTo(x+6,yy+16);c.closePath();c.fill();}
  // lockers
  const lw=40;
  for(let x=0,i=0;x<W;x+=lw+2,i++){
    const g=c.createLinearGradient(x,0,x+lw,0);
    g.addColorStop(0,"#3E5A88");g.addColorStop(.25,"#2F4670");g.addColorStop(.8,"#273B60");g.addColorStop(1,"#1B2944");
    c.fillStyle=g;c.fillRect(x,lockTop,lw,lockBot-lockTop);
    c.fillStyle="#141E33";c.fillRect(x+lw,lockTop,2,lockBot-lockTop);
    const half=lockTop+(lockBot-lockTop)*.46;
    c.fillStyle="rgba(0,0,0,.35)";c.fillRect(x,half,lw,2);c.fillStyle="rgba(255,255,255,.10)";c.fillRect(x,half+2,lw,1);
    [lockTop+10,half+10].forEach(vy=>{for(let v=0;v<4;v++){c.fillStyle="#101828";c.fillRect(x+9,vy+v*6,lw-18,3);c.fillStyle="rgba(255,255,255,.14)";c.fillRect(x+9,vy+v*6+3,lw-18,1);}});
    c.fillStyle="#C9CED6";c.fillRect(x+12,lockTop+38,16,8);c.fillStyle="#3A3F47";c.font="bold 6px sans-serif";c.textAlign="center";c.fillText(String(101+i),x+20,lockTop+44.5);
    [lockTop+(half-lockTop)*.62,half+(lockBot-half)*.45].forEach(hy=>{const hg=c.createLinearGradient(x+lw-11,0,x+lw-5,0);hg.addColorStop(0,"#F2F4F7");hg.addColorStop(1,"#868D97");c.fillStyle=hg;c.fillRect(x+lw-11,hy,6,18);c.fillStyle="rgba(0,0,0,.35)";c.fillRect(x+lw-5,hy+1,1,18);});
    c.fillStyle=`rgba(0,0,0,${rnd()*.06})`;c.fillRect(x,lockTop,lw,lockBot-lockTop);}
  // locker top trim and base
  c.fillStyle="#1A2640";c.fillRect(0,lockTop-4,W,4);c.fillStyle="#2A2A2A";c.fillRect(0,lockBot,W,floorY-lockBot);
  if(side){const sh=c.createLinearGradient(0,0,0,H);sh.addColorStop(0,"rgba(0,0,0,.15)");sh.addColorStop(.3,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.3)");c.fillStyle=sh;c.fillRect(0,0,W,H);return cv.toDataURL("image/jpeg",.85);}
  // ceiling light falloff
  for(let x=W*.12;x<W;x+=W>900?420:300){const rg=c.createRadialGradient(x,-40,10,x,-40,300);rg.addColorStop(0,"rgba(255,248,225,.55)");rg.addColorStop(1,"rgba(255,248,225,0)");c.fillStyle=rg;c.fillRect(0,0,W,floorY);}
  const shade=c.createLinearGradient(0,0,0,floorY);shade.addColorStop(0,"rgba(0,0,0,.18)");shade.addColorStop(.3,"rgba(0,0,0,0)");shade.addColorStop(1,"rgba(0,0,0,.25)");c.fillStyle=shade;c.fillRect(0,0,W,floorY);
  // floor: reflection of the wall, then speckled vinyl
  c.save();c.translate(0,floorY*2);c.scale(1,-1);c.globalAlpha=.22;c.drawImage(cv,0,0,W*dpr,floorY*dpr,0,0,W,floorY);c.restore();
  const fg=c.createLinearGradient(0,floorY,0,H);fg.addColorStop(0,"rgba(196,186,166,.72)");fg.addColorStop(1,"rgba(160,148,126,.9)");c.fillStyle=fg;c.fillRect(0,floorY,W,H-floorY);
  for(let n=0;n<W*(H-floorY)/14;n++){const sx=rnd()*W,sy=floorY+rnd()*(H-floorY);c.fillStyle=["rgba(80,70,60,.35)","rgba(255,255,255,.35)","rgba(122,15,36,.25)","rgba(30,45,74,.25)"][n%4];c.fillRect(sx,sy,1.4,1.1);}
  for(let x=0;x<W;x+=96){c.fillStyle="rgba(70,60,45,.18)";c.fillRect(x,floorY,1,H-floorY);}
  c.fillStyle="#1F1F1F";c.fillRect(0,floorY-3,W,4);
  return cv.toDataURL("image/jpeg",.85);
}

function openRoom(i){
  const r=R[i];
  screen(topbar(),h("div",{class:"wrap"},h("h2",{},`${r.period}: ${r.name}`),bubbles(r.intro,r.asset),
    h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto"},h("button",{id:"enterBtn",class:"primary",onclick:()=>r.writing?runWriting(r):runRoom(r)},"Enter Room →"))));
}
function runRoom(r){
  const ctx={tardy:0,res:r.items.map(()=>({tries:0,done:false,pts:0})),helpShown:false,start:Date.now()};
  const help=h("div",{id:"help"});
  const finishBtn=h("button",{id:"finishBtn",class:"primary",disabled:true,onclick:()=>finishRoom(r,ctx)},"Claim Page →");
  const list=h("div",{});
  const task=h("div",{class:"task"},h("h3",{},r.task),list);
  let sw=null;
  if(r.stopwatch){sw=h("span",{class:"muted"},"0 s");ctx.timer=setInterval(()=>{if(!sw.isConnected){clearInterval(ctx.timer);return;}sw.textContent=Math.round((Date.now()-ctx.start)/1000)+" s";},500);}
  const tools=h("div",{class:"row"},
    !isTest()?h("button",{onclick:()=>showRule(r,help)},"💡 Rule Card"):null,
    sw?h("span",{},"⏱️ Time: ",sw,S.best[r.id]?` (best: ${S.best[r.id]} s)`:""):null);
  screen(topbar(ctx),h("div",{class:"wrap"},h("h2",{},`${r.period}: ${r.name}`),tools,help,
    r.listen?listenPlayer():null,task,h("div",{class:"row",style:"justify-content:flex-end"},finishBtn)));
  const api={
    wrong(idx,el,fb,msg){const st=ctx.res[idx];if(st.done)return;st.tries++;
      if(isTest()){lockItem(idx,el,fb,false,msg);return;}
      ctx.tardy++;const td=document.getElementById("tardy");if(td)td.textContent=tardyText(ctx);
      el.className="item bad";
      if(st.tries===1)fb.textContent="Not quite! Check the form and try again.";
      else if(st.tries===2)fb.textContent="Hint: "+(r.items[idx].tip||"Look closely at the verb.");
      else lockItem(idx,el,fb,false,msg);
      fb.className="fb bad";
      if(ctx.tardy>=3&&!ctx.helpShown){ctx.helpShown=true;showRule(r,help,true);}
    },
    right(idx,el,fb){const st=ctx.res[idx];if(st.done)return;st.tries++;st.pts=st.tries===1?1:0;lockItem(idx,el,fb,true);},
  };
  function lockItem(idx,el,fb,ok,msg){const st=ctx.res[idx];st.done=true;
    el.className="item "+(ok?"ok":"bad");
    el.querySelectorAll("button,input").forEach(b=>b.disabled=true);
    fb.className="fb "+(ok?"ok":"bad");
    const it=r.items[idx];
    fb.textContent=ok?"Correct!":"Solution: "+msg;
    if(ok&&it.sol)fb.textContent+=it.free?" Example: "+it.sol:(it.kind==="open"?" Model: "+it.sol:"");
    if(ctx.res.every(x=>x.done))finishBtn.disabled=false;}
  r.items.forEach((it,idx)=>list.append(RENDER[it.kind](it,idx,api)));
}

function showRule(r,slot,fromZach){
  slot.replaceChildren(h("div",{class:"scene"},asset("zach",70,70,"Zach"),
    h("div",{class:"rule"},fromZach?h("p",{},h("b",{},"Zach: "),"Three tardy slips? Here is my rule card to help you out!"):null,
      h("b",{},r.rule.title),h("ul",{},r.rule.points.map(p=>h("li",{},p))),
      h("button",{style:"margin-top:8px",onclick:()=>slot.replaceChildren()},"Close"))));

function finishRoom(r,ctx){
  if(ctx.timer){clearInterval(ctx.timer);
    const sec=Math.round((Date.now()-ctx.start)/1000);
    if(!S.best[r.id]||sec<S.best[r.id])S.best[r.id]=sec;}
  S.scores[r.id]=ctx.res.reduce((n,x)=>n+x.pts,0);S.stamps[r.id]=true;save();
  screen(topbar(),h("div",{class:"wrap"},h("h2",{},`Page Secured! (${S.scores[r.id]} / ${r.items.length} pts)`),
    bubbles(r.outro,r.asset),h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto"},h("button",{id:"backBtn",class:"primary",onclick:showHallway},"Back to Hallway"))));
}

const RENDER={

  const b=(lab,key)=>h("button",{"data-key":key,onclick:()=>key===it.a?api.right(idx,el,fb):api.wrong(idx,el,fb,it.sol)},lab);
  el.append(h("div",{},`${idx+1}. ${it.text}`),h("div",{class:"choices"},b("-ing form","g"),b("to + verb","i")),fb);return el;},
 gap(it,idx,api){
  const fb=h("div",{class:"fb"});const el=h("div",{class:"item"});
  const inp=h("input",{type:"text",style:"width:140px",autocapitalize:"off",autocomplete:"off","aria-label":it.verb});
  const solFull=`${it.before} ${it.a[0]} ${it.after}`.trim();
  const go=()=>{if(!inp.value.trim())return;it.a.some(a=>norm(a)===norm(inp.value))?api.right(idx,el,fb):api.wrong(idx,el,fb,solFull);};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  el.append(h("div",{},it.who?h("b",{},it.who+": "):null,it.before+" ",inp," ",it.after),
    h("button",{style:"margin-top:6px",onclick:go},"Check"),fb);return el;},
 fix(it,idx,api){
  const fb=h("div",{class:"fb"});const el=h("div",{class:"item"});let sel=null;
  const inp=h("input",{type:"text",style:"width:200px",placeholder:"Correction",autocapitalize:"off",autocomplete:"off"});
  const sol=it.chunks.map((c,i)=>i===it.err?it.a[0]:c).join(" ");
  const sent=h("div",{},it.chunks.map((c,i)=>{const b=h("span",{class:"chunk",tabindex:"0",role:"button"},c);
    const pick=()=>{sent.querySelectorAll(".chunk").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=i;inp.focus();};
    b.onclick=pick;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}};return b;}));
  const go=()=>{
    if(sel===null){fb.className="fb bad";fb.textContent="First tap the mistake.";return;}
    if(sel!==it.err){api.wrong(idx,el,fb,sol);return;}
    if(!inp.value.trim())return;
    it.a.some(a=>norm(a)===norm(inp.value))?api.right(idx,el,fb):api.wrong(idx,el,fb,sol);};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  el.append(h("div",{},`${idx+1}. `,sent),h("div",{class:"row",style:"margin-top:6px"},inp,h("button",{onclick:go},"Check")),fb);return el;},
 open(it,idx,api){
  const fb=h("div",{class:"fb"});const el=h("div",{class:"item"});
  const inp=h("input",{type:"text",style:"flex:1;min-width:200px",placeholder:it.start||it.end?"":"Your sentence",autocomplete:"off"});
  const go=()=>{if(!norm(inp.value))return;
    checkOpen(it,inp.value)?api.right(idx,el,fb):api.wrong(idx,el,fb,it.sol);};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  el.append(h("div",{},`${idx+1}. `,h("b",{},it.q)),
    h("div",{class:"row",style:"margin-top:6px"},it.start?h("span",{},it.start):null,inp,it.end?h("span",{},it.end):null,h("button",{onclick:go},"Check")),fb);return el;},
 mc(it,idx,api){
  const fb=h("div",{class:"fb"});const el=h("div",{class:"item"});
  const order=shuffle(it.opts.map((o,i)=>i));
  el.append(h("div",{},`${idx+1}. ${it.q}`),
    h("div",{class:"choices"},order.map(i=>h("button",{"data-opt":i,onclick:()=>i===it.a?api.right(idx,el,fb):api.wrong(idx,el,fb,it.opts[it.a])},it.opts[i]))),fb);return el;}
};

function listenPlayer(){
  const P=CONTENT.podcast;let plays=0;const maxPlays=isTest()?2:99;
  const box=h("div",{class:"task"},h("h3",{},"🎧 Podcast: "+P.title));
  if(ASSETS.podcast_audio){
    const au=h("audio",{src:ASSETS.podcast_audio,preload:"auto"});
    const status=h("span",{class:"muted"},isTest()?"You can listen twice.":"");
    const playBtn=h("button",{class:"primary"},"▶ Play Podcast");
    const pauseBtn=h("button",{onclick:()=>au.pause()},"❚❚ Pause");
    playBtn.onclick=()=>{
      if(!au.paused||au.currentTime>0&&!au.ended){au.play();return;}
      if(plays>=maxPlays)return;
      plays++;au.currentTime=0;au.play();
      status.textContent=`Plays: ${plays}`+(isTest()?` / ${maxPlays}`:"");
      if(plays>=maxPlays)au.addEventListener("ended",()=>playBtn.disabled=true,{once:true});};
    box.append(au,h("div",{class:"row"},playBtn,pauseBtn,status));
    return box;
  }
  if(!hasTTS()){box.append(h("p",{class:"fb bad"},"This browser can't play the podcast. Please ask your teacher to read it out."));return box;}
  const status=h("span",{class:"muted"},isTest()?"You can listen twice.":"");
  const playBtn=h("button",{class:"primary"},"▶ Play Podcast");
  const stopBtn=h("button",{onclick:()=>speechSynthesis.cancel()},"■ Stop");
  playBtn.onclick=()=>{
    if(plays>=maxPlays)return;
    plays++;speechSynthesis.cancel();
    const voices=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));
    P.lines.forEach(l=>{const u=new SpeechSynthesisUtterance(l.t);u.lang="en-US";u.rate=.9;
      if(voices.length)u.voice=voices[l.v%voices.length];
      u.pitch=[1.1,1.0,.8][l.v]||1;speechSynthesis.speak(u);});
    status.textContent=`Plays: ${plays}`+(isTest()?` / ${maxPlays}`:"");
    if(plays>=maxPlays)playBtn.disabled=true;};
  box.append(h("div",{class:"row"},playBtn,stopBtn,status));
  return box;
}

/* ---- Writing Room ---- */
function runWriting(r){
  const W=CONTENT.writing;
  if(!S.writing.prompt){
    return screen(topbar(),h("div",{class:"wrap"},h("h2",{},"Choose Writing Topic"),
      h("div",{class:"row"},W.prompts.map(p=>h("button",{"data-prompt":p.id,style:"flex:1;min-width:240px;padding:20px;text-align:left",onclick:()=>{S.writing.prompt=p.id;save();runWriting(r);}},h("h3",{},p.title),p.text)))));}
  const P=W.prompts.find(p=>p.id===S.writing.prompt);
  const title=h("input",{type:"text",placeholder:"Yearbook Entry Title",value:S.writing.title||"",style:"width:100%;margin-bottom:8px"});
  const ta=h("textarea",{id:"writeText",placeholder:"Write your entry here..."});ta.value=S.writing.text||"";
  const wc=h("b",{});const checks=h("ul",{class:"check",style:"padding:0"});
  const done=h("button",{id:"submitWriting",class:"primary"},"Submit Yearbook Page");
  const helpers=isTest()?null:h("details",{style:"margin-top:10px"},h("summary",{},"Word bank & sentence starters"),
    h("p",{class:"muted",style:"font-size:15px"},W.wordbank.join(" · ")),
    h("ul",{style:"font-size:15px;padding-left:1.2em"},W.starters.map(s=>h("li",{},s))));

  const update=()=>{
    S.writing.text=ta.value;S.writing.title=title.value;save();
    const n=(ta.value.match(/\b[\w'’-]+\b/g)||[]).length;
    wc.textContent=`Word Count: ${n} (${W.minWords} to ${W.maxWords})`;
    checks.replaceChildren(
      h("li",{class:n>=W.minWords?"hit":""},`${W.minWords}+ words`),
      ...(isTest()?[]:W.detect.map(d=>h("li",{class:d.re.test(ta.value)?"hit":""},d.label))),
      ...W.selfcheck.map(s=>h("li",{class:"muted"},s)));
    done.disabled=n<Math.round(W.minWords*.6);};

  ta.addEventListener("input",update);title.addEventListener("input",update);
  done.onclick=()=>{S.stamps[r.id]=true;S.scores[r.id]=0;save();
    screen(topbar(),h("div",{class:"wrap"},h("h2",{},"Yearbook Entry Complete!"),bubbles(r.outro,r.asset),
      h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto"},
        h("button",{onclick:printPage},"🖨️ Print Page"),
        h("button",{id:"backBtn",class:"primary",onclick:showHallway},"Back to Hallway"))));};

  screen(topbar(),h("div",{class:"wrap"},h("h2",{},`${r.period}: ${r.name}`),
    h("div",{class:"task"},h("h3",{},P.title),h("p",{},P.text),helpers),
    h("div",{class:"write-grid"},
      h("div",{},title,ta,h("p",{},wc)),
      h("div",{class:"task"},h("h3",{},"Checklist"),checks,done))));
  update();
}

function printPage(){
  const name=prompt("Your name for the yearbook:",S.writing.name||"")||"";
  S.writing.name=name;save();
  const pp=document.getElementById("printpage");
  pp.replaceChildren(h("div",{class:"muted"},"Birchview Middle School Yearbook"),
    h("h1",{},S.writing.title||"My Yearbook Page"),name?h("p",{},h("i",{},"By "+name)):null,
    ...S.writing.text.split(/\n+/).map(p=>h("p",{},p)));
  window.print();
}

/* ---- Bonus Room ---- */

    h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto"},h("button",{id:"enterBtn",class:"primary",onclick:runBonus},"Inspect Notes"))));

function runBonus(){
  const B=CONTENT.bonus;const pick=B.puzzles.map(()=>null);
  const help=h("div",{});
  const digits=h("div",{class:"row",style:"justify-content:center"},B.puzzles.map(()=>h("b",{style:"font-size:32px;padding:8px 16px;background:#FFF;border:2px solid var(--c-navy);border-radius:6px"},"?")));
  const fb=h("div",{class:"fb"});
  const refresh=()=>[...digits.children].forEach((s,i)=>s.textContent=pick[i]===null?"?":B.puzzles[i].opts[pick[i]].d);
  const cards=B.puzzles.map((p,i)=>h("div",{class:"item"},
    h("div",{},h("b",{},`Note ${i+1}: `),h("i",{},`“${p.note}”`)),
    h("div",{class:"muted",style:"font-size:15px"},p.q),
    h("div",{class:"choices"},p.opts.map((o,j)=>{const b=h("button",{"data-puzzle":i,"data-opt":j},o.t);
      b.onclick=()=>{pick[i]=j;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("primary"));b.classList.add("primary");refresh();};return b;}))));
  const tryLock=h("button",{id:"unlockBtn",class:"primary",onclick:()=>{
    if(pick.includes(null)){fb.className="fb bad";fb.textContent="Answer all notes first.";return;}
    const code=pick.map((j,i)=>B.puzzles[i].opts[j].d).join("");
    if(code===B.code){S.gold=true;save();
      screen(topbar(),h("div",{class:"wrap"},h("h2",{},"The Lock Opens!"),bubbles(B.outro,B.asset),
        h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto"},h("button",{id:"backBtn",class:"primary",onclick:showHallway},"Back to Hallway"))));}
    else{fb.className="fb bad";fb.textContent="Click... Nothing happens. Check the meanings again.";}}},"Unlock Door");
  screen(topbar(),h("div",{class:"wrap"},h("h2",{},B.name),
    !isTest()?h("div",{class:"row"},h("button",{onclick:()=>showRule(B,help)},"💡 Rule Card")):null,help,
    h("p",{},B.task),h("div",{class:"task"},cards),
    h("div",{class:"task",style:"text-align:center"},digits,h("div",{style:"margin-top:12px"},tryLock),fb)));
}

/* ---- Study Hall ---- */
function embedSrc(u){
  u=String(u||"").trim();
  const m=u.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);if(m)u=m[1];
  u=u.replace(/&amp;/g,"&");
  if(!/^https:\/\/([a-z0-9-]+\.)*(learningapps\.org|learningsnacks\.de|learningsnacks\.com)\//i.test(u))return null;
  if(/learningapps\.org/i.test(u)){
    // every LearningApps link form (share, view, display, watch) becomes the embeddable player
    const v=u.match(/[?&]v=([a-z0-9]+)/i);if(v)return "https://learningapps.org/watch?v="+v[1];
    const id=u.match(/learningapps\.org\/(?:view|watch\?app=|display\?app=|index\.php\?app=)?(\d{4,})/i);
    if(id)return "https://learningapps.org/watch?app="+id[1];
  }
  return u;
}
function showStudyHall(){
  const SH=CONTENT.studyhall;
  const list=SH.items.map(it=>({...it,src:embedSrc(it.url)})).filter(it=>it.src);
  screen(topbar(),h("div",{class:"wrap"},
    h("h2",{},"Study Hall"),
    bubble({who:SH.host,asset:SH.asset,text:SH.intro}),
    list.length?h("div",{class:"sh-grid"},list.map(it=>h("button",{class:"sh-card",onclick:()=>openExercise(it)},
        h("span",{class:"tag"},it.tag||"Practice"),h("span",{class:"t"},it.title),h("span",{},it.info||""),
        h("span",{class:"src"},new URL(it.src).hostname.replace(/^www\./,"")))))
      :h("div",{class:"sh-empty"},"No exercises here yet. Your teacher will add extra practice soon."),
    h("div",{class:"row",style:"justify-content:flex-end;margin-top:auto;padding-top:16px"},
      h("button",{class:"primary",onclick:showHallway},"Back to Hallway"))));
}
function openExercise(it){
  let ov;const close=()=>{ov.remove();document.removeEventListener("keydown",esc);};
  const esc=e=>{if(e.key==="Escape")close();};
  ov=h("div",{class:"sh-view",role:"dialog","aria-label":it.title},
    h("div",{class:"sh-bar"},h("button",{onclick:close},"← Study Hall"),h("b",{},it.title),
      h("a",{href:it.src,target:"_blank",rel:"noopener"},"Open in new tab ↗")),
    h("div",{class:"sh-note"},`This exercise loads from ${new URL(it.src).hostname}. It doesn't count for your hall pass.`),
    h("iframe",{src:it.src,title:it.title,allow:"fullscreen; autoplay",allowfullscreen:true,loading:"lazy"}));
  document.body.append(ov);document.addEventListener("keydown",esc);
}

/* ---- Teacher View (?teacher=1): all tasks with solutions, podcast script, glossary ---- */
function showTeacher(){
  const sol=it=>{
    if(it.kind==="sort")return it.sol;
    if(it.kind==="gap")return `${it.before} ${it.a.join(" / ")} ${it.after}`.trim();
    if(it.kind==="fix")return it.chunks.map((c,i)=>i===it.err?`[${c} → ${it.a[0]}]`:c).join(" ");
    if(it.kind==="mc")return `${it.q} → ${it.opts[it.a]}`;
    return it.sol;};
  const q=it=>it.kind==="sort"?it.text:it.kind==="open"?it.q:it.kind==="mc"?null:it.kind==="gap"?`(${it.verb})`:null;
  const B=CONTENT.bonus;
  $app.style.cssText="max-height:none;height:auto;overflow:visible";
  document.body.style.cssText="display:block;height:auto";
  screen(h("div",{class:"wrap"},
    h("div",{class:"row"},h("h1",{},"Seven Periods: Lehrkraftansicht"),h("div",{style:"flex:1"}),h("button",{onclick:()=>window.print()},"🖨️ Drucken")),
    h("p",{class:"muted"},`${maxPoints()} Punkte in ${R.filter(r=>r.items.length).length} Räumen. Punkte nur für richtige Antworten im ersten Versuch.`),
    R.map(r=>h("div",{class:"task"},h("h2",{},`${r.period}: ${r.name}`),h("p",{},h("b",{},r.task)),
      r.items.length?h("ol",{},r.items.map(it=>h("li",{},q(it)?h("div",{class:"muted"},q(it)):null,sol(it),it.tip?h("div",{class:"muted",style:"font-size:14px"},"Tipp: "+it.tip):null)))
        :h("div",{},CONTENT.writing.prompts.map(p=>h("p",{},h("b",{},p.title+": "),p.text))))),
    h("div",{class:"task"},h("h2",{},"Podcast-Skript: "+CONTENT.podcast.title),
      CONTENT.podcast.lines.map(l=>h("p",{},h("b",{},l.who+": "),l.t))),
    h("div",{class:"task"},h("h2",{},"Bonus: "+B.name+` (Code ${B.code})`),
      h("ol",{},B.puzzles.map(p=>h("li",{},`„${p.note}“ → `,p.opts.find(o=>B.code.includes(o.d)).t)))),
    h("div",{class:"task"},h("h2",{},"Study Hall (ohne Wertung)"),
      h("p",{class:"muted"},"Links in CONTENT.studyhall.items eintragen (LearningApps- oder LearningSnacks-Link oder kompletter Einbettungscode). Karten ohne gültigen Link bleiben unsichtbar."),
      h("ul",{},CONTENT.studyhall.items.map(it=>h("li",{},h("b",{},it.title),": ",embedSrc(it.url)||"noch kein Link")))),
    h("div",{class:"task"},h("h2",{},"Glossar"),
      h("ul",{},CONTENT.glossary.map(g=>h("li",{},h("b",{},g.term),`: ${g.de}`,g.uk?` (${g.uk})`:""))))));
}
