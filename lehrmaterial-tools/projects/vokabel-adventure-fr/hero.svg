<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Platzhalter-Titelbild: stilisierter Eiffelturm vor Nachthimmel, bis das endgueltige Marianne-Motiv fertig ist">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#132743"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0ab3d" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f0ab3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="400" cy="190" r="230" fill="url(#glow)"/>
  <rect x="0" y="470" width="800" height="10" fill="#0033a0" opacity=".55"/>
  <rect x="0" y="480" width="800" height="10" fill="#f5f5f5" opacity=".35"/>
  <rect x="0" y="490" width="800" height="10" fill="#c8102e" opacity=".55"/>
  <g stroke="#f0ab3d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M400 60 L330 430 M400 60 L470 430"/>
    <path d="M362 200 L438 200"/>
    <path d="M345 300 L455 300"/>
    <path d="M330 430 L470 430"/>
    <path d="M400 60 L400 20"/>
    <path d="M300 430 L500 430 L470 300 L330 300 Z" opacity=".5"/>
  </g>
  <text x="400" y="460" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="18" fill="#c7d2e3" opacity=".8">Titelbild folgt</text>
</svg>
